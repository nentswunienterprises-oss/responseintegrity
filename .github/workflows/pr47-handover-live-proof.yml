name: PR47 Handover Live Proof

on:
  push:
    branches:
      - feat/evidence-complete-diagnosis
    paths:
      - '.github/workflows/pr47-handover-live-proof.yml'
      - 'api/proof-environment.ts'
      - 'server/routes.ts'
      - 'server/supabaseAuth.ts'
      - 'server/emergencyAuth.ts'
      - 'client/src/components/tutor/IntroSessionDrillRunner.tsx'
      - 'client/src/components/tutor/StudentCard.tsx'
      - 'shared/responseIntegrityDrillRegistry.ts'
      - 'shared/diagnosisObservationMatrix.ts'
      - 'shared/responseEvidenceModel.ts'
      - 'shared/handoverEvidenceEvaluator.ts'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  live-handover-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SMOKE_BASE_URL: https://tt-confidence-hub-git-feat-evi-31b8c6-relief-works-technologies.vercel.app
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve expected Preview app SHA
        shell: bash
        run: |
          APP_SHA="$GITHUB_SHA"
          while true; do
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$APP_SHA")"
            if [ "$CHANGED_FILES" = ".github/workflows/pr47-handover-live-proof.yml" ]; then
              APP_SHA="$(git rev-parse "$APP_SHA^")"
            else
              break
            fi
          done
          echo "PROOF_EXPECTED_APP_SHA=$APP_SHA" >> "$GITHUB_ENV"
          echo "Resolved deployed app SHA: $APP_SHA"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove evidence-driven Handover through deployed Specialist UI
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const baseUrl = String(process.env.SMOKE_BASE_URL || "").replace(/\/$/, "");
          const email = String(process.env.RI_PROOF_EMAIL || "").trim();
          const password = String(process.env.RI_PROOF_PASSWORD || "");
          const bypass = String(process.env.VERCEL_AUTOMATION_BYPASS_SECRET || "").trim();
          const expectedCommit = String(
            process.env.PROOF_EXPECTED_APP_SHA || process.env.GITHUB_SHA || "",
          ).trim();
          const studentId = "828a5609-462c-4772-841a-0590ceb6a84e";
          const expectedTopic = "Geometry";
          const expectedPhase = "Time Pressure Stability";
          const expectedStability = "High";

          assert.ok(baseUrl && email && password && expectedCommit, "Proof runtime configuration is required");

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1100 },
            ...(bypass
              ? { extraHTTPHeaders: { "x-vercel-protection-bypass": bypass } }
              : {}),
          });
          const page = await context.newPage();

          async function waitForCurrentPreview() {
            let last = null;
            for (let attempt = 1; attempt <= 36; attempt += 1) {
              const response = await page.request.get(baseUrl + "/api/proof-environment", {
                timeout: 60000,
              }).catch(() => null);
              if (response?.ok()) {
                const body = await response.json().catch(() => null);
                last = body;
                if (
                  body?.vercelEnv === "preview" &&
                  body?.supabaseProjectRef === "jftlxeacphvbnhbsbpxc" &&
                  body?.commitSha === expectedCommit
                ) {
                  console.log("PR47_HANDOVER_PREVIEW_READY=" + JSON.stringify({
                    attempt,
                    commitSha: body.commitSha,
                    supabaseProjectRef: body.supabaseProjectRef,
                  }));
                  return body;
                }
              }
              await page.waitForTimeout(5000);
            }
            throw new Error(
              "Preview alias did not reach current commit. Last proof: " + JSON.stringify(last),
            );
          }

          async function login() {
            await page.goto(
              baseUrl + "/operational/signup?role=tutor&mode=login&lock=login&returnTo=/specialist/pod",
              { waitUntil: "domcontentloaded", timeout: 90000 },
            );
            await page.locator("#login-email").fill(email);
            await page.locator("#login-password").fill(password);
            const [signin] = await Promise.all([
              page.waitForResponse(
                (response) =>
                  response.url().includes("/api/auth/signin") &&
                  response.request().method() === "POST",
                { timeout: 60000 },
              ),
              page.getByRole("button", { name: "Login", exact: true }).click(),
            ]);
            const signinText = await signin.text();
            assert.ok(
              signin.ok(),
              "Proof Specialist login failed: " + signin.status() + " " + signinText,
            );
            const body = JSON.parse(signinText);
            assert.equal(body?.dbUser?.role, "tutor");
          }

          async function jsonRequest(method, path, data) {
            const options = { timeout: 60000 };
            if (data !== undefined) options.data = data;
            const response =
              method === "POST"
                ? await page.request.post(baseUrl + path, options)
                : await page.request.get(baseUrl + path, options);
            const text = await response.text();
            assert.ok(
              response.ok(),
              method + " " + path + " failed: " + response.status() + " " + text,
            );
            return text ? JSON.parse(text) : null;
          }

          async function topicState(topic) {
            const body = await jsonRequest(
              "GET",
              "/api/tutor/topic-conditioning/" + encodeURIComponent(studentId),
            );
            const rows = Array.isArray(body)
              ? body
              : Array.isArray(body?.topics)
                ? body.topics
                : [];
            const row = rows.find(
              (candidate) =>
                String(candidate?.topic || "").trim().toLowerCase() ===
                topic.trim().toLowerCase(),
            );
            assert.ok(row, "Topic missing from canonical state: " + topic);
            return row;
          }

          async function chooseBehavior(label, option) {
            const labelNode = page.locator("label").filter({ hasText: label }).first();
            await labelNode.waitFor({ state: "visible", timeout: 30000 });
            const block = labelNode.locator("..");
            const button = block.getByRole("button").filter({ hasText: option }).first();
            await button.waitFor({ state: "visible", timeout: 30000 });
            await button.click();
          }

          async function chooseSupportedTimePressureEvidence() {
            await chooseBehavior(
              "Start under time",
              "Started promptly with a valid structured first move",
            );
            await chooseBehavior(
              "Structure under time",
              "Method structure held under the timer",
            );
            await chooseBehavior(
              "Pace control",
              "Maintained a deliberate, controlled pace",
            );
            await chooseBehavior(
              "Completion integrity",
              "Completed while preserving method structure",
            );
          }

          try {
            await waitForCurrentPreview();
            await login();

            const fixture = await jsonRequest(
              "POST",
              "/api/proof/handover-fixture/reset",
              { studentId, topic: expectedTopic },
            );
            assert.equal(fixture?.studentId, studentId);
            assert.equal(fixture?.topic, expectedTopic);
            assert.equal(fixture?.phase, expectedPhase);
            assert.equal(fixture?.stability, expectedStability);
            assert.equal(fixture?.session?.type, "handover");
            assert.equal(fixture?.session?.status, "confirmed");
            const sessionId = String(fixture?.session?.id || "");
            assert.ok(sessionId, "Proof fixture did not return a Handover session ID");

            const beforeWorkflow = await jsonRequest(
              "GET",
              "/api/tutor/students/" + studentId + "/workflow-state",
            );
            assert.equal(beforeWorkflow?.handoverVerificationRequired, true);
            assert.equal(beforeWorkflow?.handoverSessionConfirmed, true);
            assert.equal(beforeWorkflow?.handoverCompleted, false);

            const beforeTopic = await topicState(expectedTopic);
            assert.equal(beforeTopic.phase, expectedPhase);
            assert.equal(beforeTopic.stability, expectedStability);

            const handoverUrl =
              baseUrl +
              "/specialist/intro-session/" +
              encodeURIComponent(studentId) +
              "?mode=handover&topic=" +
              encodeURIComponent(expectedTopic) +
              "&phase=" +
              encodeURIComponent(expectedPhase) +
              "&stability=" +
              encodeURIComponent(expectedStability) +
              "&scheduledSessionId=" +
              encodeURIComponent(sessionId);

            await page.goto(handoverUrl, {
              waitUntil: "domcontentloaded",
              timeout: 90000,
            });

            await page.getByText("Handover Prep", { exact: true }).waitFor({
              state: "visible",
              timeout: 60000,
            });
            await page.getByText(/Extra prepared problems are reserve only, not a completion target/i)
              .waitFor({ state: "visible", timeout: 30000 });

            const confirmations = [
              "I reviewed the inherited Time Pressure Stability",
              "I prepared a small reserve bank of clean continuity problems",
              "I will verify continuity only and will not restart or train forward",
            ];
            for (const confirmation of confirmations) {
              const button = page.getByRole("button").filter({ hasText: confirmation }).first();
              await button.waitFor({ state: "visible", timeout: 30000 });
              await button.click();
            }
            await page.getByRole("button", { name: "Start Verification", exact: true }).click();

            await page.getByRole("heading", {
              name: "Handover Verification - Time Pressure Stability",
              exact: true,
            }).waitFor({ state: "visible", timeout: 60000 });
            await page.getByText("EVIDENCE OPPORTUNITY 1", { exact: true })
              .waitFor({ state: "visible", timeout: 30000 });

            await chooseSupportedTimePressureEvidence();
            await page.getByRole("button", {
              name: "Evaluate Continuity Evidence",
              exact: true,
            }).click();

            await page.getByText("EVIDENCE OPPORTUNITY 2", { exact: true })
              .waitFor({ state: "visible", timeout: 30000 });
            await page.getByText(/Continuity evidence is not yet sufficient after opportunity 1/i)
              .waitFor({ state: "visible", timeout: 30000 });

            await chooseSupportedTimePressureEvidence();

            const responsePromise = page.waitForResponse(
              (response) =>
                response.url().includes("/api/tutor/handover-verification-drill") &&
                response.request().method() === "POST",
              { timeout: 120000 },
            );
            await page.getByRole("button", {
              name: "Evaluate Continuity Evidence",
              exact: true,
            }).click();

            const submit = await responsePromise;
            const submitText = await submit.text();
            assert.ok(
              submit.ok(),
              "Handover submission failed: " + submit.status() + " " + submitText,
            );
            const result = JSON.parse(submitText);
            const summary = result?.summary || {};
            assert.equal(summary.decisionAuthority, "evidence_native");
            assert.equal(summary.scoreAuthority, false);
            assert.equal(summary.verificationOutcome, "hold");
            assert.equal(summary.resultingPhase, expectedPhase);
            assert.equal(summary.resultingStability, expectedStability);
            assert.equal(summary.reDiagnosisRequired, false);
            assert.equal(
              Array.isArray(summary.dimensions) &&
                summary.dimensions.every((dimension) => dimension.state === "SUPPORTED"),
              true,
              "Expected every Time Pressure Handover dimension to resolve SUPPORTED",
            );

            await page.getByText("Response Evidence Decision", { exact: true })
              .waitFor({ state: "visible", timeout: 60000 });
            await page.getByText(/Inherited state confirmed|Inherited state held/i)
              .waitFor({ state: "visible", timeout: 30000 });
            await page.getByText(
              "No compatibility score decided this Handover outcome. The decision above comes from the recorded Response Evidence behavior classes.",
              { exact: true },
            ).waitFor({ state: "visible", timeout: 30000 });

            const afterTopic = await topicState(expectedTopic);
            assert.equal(afterTopic.phase, expectedPhase);
            assert.equal(afterTopic.stability, expectedStability);

            const completed = await jsonRequest(
              "POST",
              "/api/tutor/students/" + studentId + "/workflow/handover-completed",
              {},
            );
            assert.equal(completed?.handoverCompleted, true);

            const afterWorkflow = await jsonRequest(
              "GET",
              "/api/tutor/students/" + studentId + "/workflow-state",
            );
            assert.equal(afterWorkflow?.handoverVerificationRequired, false);
            assert.equal(afterWorkflow?.handoverCompleted, true);

            console.log("PR47_HANDOVER_LIVE_PROOF=PASS " + JSON.stringify({
              studentId,
              topic: expectedTopic,
              inheritedState: expectedPhase + " / " + expectedStability,
              outcome: summary.verificationOutcome,
              sessionId,
              evidenceAuthority: summary.decisionAuthority,
            }));
          } finally {
            await browser.close();
          }
          NODE
