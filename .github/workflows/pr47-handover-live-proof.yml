name: PR47 Handover Live Proof

on:
  push:
    branches:
      - feat/evidence-complete-diagnosis
    paths:
      - '.github/workflows/pr47-handover-live-proof.yml'
      - '.github/scripts/pr47-handover-live-proof.mjs'
      - 'api/proof-environment.ts'
      - 'server/routes.ts'
      - 'server/supabaseAuth.ts'
      - 'server/emergencyAuth.ts'
      - 'client/src/components/tutor/IntroSessionDrillRunner.tsx'
      - 'client/src/components/tutor/StudentCard.tsx'
      - 'shared/responseIntegrityDrillRegistry.ts'
      - 'shared/diagnosisObservationMatrix.ts'
      - 'shared/responseEvidenceModel.ts'
      - 'shared/handoverEvidenceEvaluator.ts'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  live-handover-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_BASE_URL: https://tt-confidence-hub-git-feat-evi-31b8c6-relief-works-technologies.vercel.app
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Resolve expected Preview app SHA
        shell: bash
        run: |
          APP_SHA="$GITHUB_SHA"
          while true; do
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$APP_SHA")"
            NON_GITHUB_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -v '^\.github/' || true)"
            if [ -n "$CHANGED_FILES" ] && [ -z "$NON_GITHUB_FILES" ]; then
              APP_SHA="$(git rev-parse "$APP_SHA^")"
            else
              break
            fi
          done
          echo "PROOF_EXPECTED_APP_SHA=$APP_SHA" >> "$GITHUB_ENV"
          echo "Resolved deployed app SHA: $APP_SHA"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove Handover evidence matrix through deployed Specialist UI
        run: node .github/scripts/pr47-handover-live-proof.mjs
