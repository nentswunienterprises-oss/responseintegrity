name: Clean RI infographic staging artifact

on:
  push:
    branches:
      - training/tools-required-two-mode-standard
    paths:
      - .github/workflows/clean-ri-infographic-staging.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: training/tools-required-two-mode-standard
          fetch-depth: 0

      - name: Remove temporary staging artifact
        shell: bash
        run: |
          rm -f .tmp/modelling-vs-observation-locked.b64
          rm -f .github/workflows/clean-ri-infographic-staging.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary infographic staging artifact"
          git push origin HEAD:training/tools-required-two-mode-standard
