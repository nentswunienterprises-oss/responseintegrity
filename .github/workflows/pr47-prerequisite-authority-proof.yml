name: PR47 Prerequisite Authority Proof

on:
  push:
    branches:
      - feat/evidence-complete-diagnosis
    paths:
      - '.github/workflows/pr47-prerequisite-authority-proof.yml'

permissions:
  contents: read
  statuses: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_BASE_URL: https://tt-confidence-hub-git-feat-evi-31b8c6-relief-works-technologies.vercel.app
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inventory current proof fixtures
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const baseUrl = String(process.env.SMOKE_BASE_URL || "").replace(/\/$/, "");
          const email = String(process.env.RI_PROOF_EMAIL || "").trim();
          const password = String(process.env.RI_PROOF_PASSWORD || "");
          const bypass = String(process.env.VERCEL_AUTOMATION_BYPASS_SECRET || "").trim();
          assert.ok(baseUrl && email && password, "Proof runtime credentials are required");

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            ...(bypass ? { extraHTTPHeaders: { "x-vercel-protection-bypass": bypass } } : {}),
          });
          const page = await context.newPage();

          try {
            const proof = await page.request.get(baseUrl + "/api/proof-environment", { timeout: 60000 });
            const proofText = await proof.text();
            assert.ok(proof.ok(), "Proof environment failed: " + proof.status() + " " + proofText);
            const proofBody = JSON.parse(proofText);
            assert.equal(proofBody.vercelEnv, "preview");
            assert.equal(proofBody.requiredEnv?.SUPABASE_SERVICE_ROLE_KEY, true);
            console.log("PR47_PREREQ_ENV=" + JSON.stringify({
              vercelEnv: proofBody.vercelEnv,
              supabaseProjectRef: proofBody.supabaseProjectRef,
            }));

            await page.goto(baseUrl + "/operational/signup?role=tutor&mode=login&lock=login&returnTo=/specialist/pod", {
              waitUntil: "domcontentloaded",
              timeout: 90000,
            });
            await page.locator("#login-email").fill(email);
            await page.locator("#login-password").fill(password);
            const [signin] = await Promise.all([
              page.waitForResponse(
                (r) => r.url().includes("/api/auth/signin") && r.request().method() === "POST",
                { timeout: 60000 },
              ),
              page.getByRole("button", { name: "Login", exact: true }).click(),
            ]);
            const signinText = await signin.text();
            assert.ok(signin.ok(), "Login failed: " + signin.status() + " " + signinText);

            const podResponse = await page.request.get(baseUrl + "/api/tutor/pod", { timeout: 60000 });
            const podText = await podResponse.text();
            assert.ok(podResponse.ok(), "Pod failed: " + podResponse.status() + " " + podText);
            const pod = JSON.parse(podText);
            const students = Array.isArray(pod) ? pod : Array.isArray(pod?.students) ? pod.students : [];

            const sessionsResponse = await page.request.get(baseUrl + "/api/tutor/sessions", { timeout: 60000 });
            const sessionsText = await sessionsResponse.text();
            const sessionsBody = sessionsResponse.ok() ? JSON.parse(sessionsText) : { error: sessionsText };
            console.log("PR47_PREREQ_SESSIONS=" + JSON.stringify(sessionsBody));

            const inventory = [];
            for (const student of students) {
              const studentId = String(student?.id || "").trim();
              if (!studentId) continue;
              const topicsResponse = await page.request.get(
                baseUrl + "/api/tutor/topic-conditioning/" + encodeURIComponent(studentId),
                { timeout: 60000 },
              );
              const topicsText = await topicsResponse.text();
              const topics = topicsResponse.ok() ? JSON.parse(topicsText) : { error: topicsText };

              const accessResponse = await page.request.get(
                baseUrl + "/api/tutor/students/" + encodeURIComponent(studentId) + "/drill-session-access?kind=training",
                { timeout: 60000 },
              );
              const accessText = await accessResponse.text();
              const trainingAccess = accessResponse.ok() ? JSON.parse(accessText) : { error: accessText };

              inventory.push({
                id: studentId,
                name: student?.name || student?.fullName || student?.full_name || null,
                operationalMode: student?.operationalMode || student?.operational_mode || null,
                topics,
                trainingAccess,
              });
            }

            console.log("PR47_PREREQ_INVENTORY=" + JSON.stringify(inventory));
            console.log("PR47_PREREQ_INVENTORY_PASS");
          } finally {
            await browser.close();
          }
          NODE
