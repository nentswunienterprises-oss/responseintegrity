name: Sandbox Package Cycle CI
on:
  pull_request:
    paths:
      - "server/sandboxPackageCycle.ts"
      - "server/sandboxPackageCycle.test.ts"
      - "server/sandboxPackageCycleRoutes.test.ts"
      - "server/proofSandboxCommercialState.ts"
      - "server/routes.ts"
      - "server/evidenceCompleteDiagnosisRoutes.ts"
      - ".github/workflows/sandbox-package-cycle-ci.yml"
  push:
    branches:
      - main
    paths:
      - "server/sandboxPackageCycle.ts"
      - "server/sandboxPackageCycle.test.ts"
      - "server/sandboxPackageCycleRoutes.test.ts"
      - "server/proofSandboxCommercialState.ts"
      - "server/routes.ts"
      - "server/evidenceCompleteDiagnosisRoutes.ts"
      - ".github/workflows/sandbox-package-cycle-ci.yml"
permissions:
  contents: read
jobs:
  sandbox-package-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sandbox package-cycle unit regressions
        run: node --import tsx --test server/sandboxPackageCycle.test.ts server/sandboxPackageCycleRoutes.test.ts
      - name: Compile backend
        run: npm run build:backend
      - name: Compile Vercel API
        run: npm run build:vercel-api
