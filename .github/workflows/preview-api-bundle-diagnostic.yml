name: Preview API Bundle Diagnostic

on:
  push:
    branches:
      - feat/demand-production-gateway
    paths:
      - '.github/workflows/preview-api-bundle-diagnostic.yml'
  workflow_dispatch:

jobs:
  bundle-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Bundle preview API
        run: |
          mkdir -p .tmp
          npx esbuild api/index.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --packages=external \
            --target=node24 \
            --outfile=.tmp/ri-preview-api.mjs

      - name: Import bundled preview API
        env:
          NODE_ENV: production
          VERCEL_ENV: preview
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: diagnostic-anon-key
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          SESSION_SECRET: diagnostic-session-secret
        run: |
          node .tmp/ri-preview-api.mjs
          echo 'PREVIEW_API_BUNDLE_IMPORT=PASS'
