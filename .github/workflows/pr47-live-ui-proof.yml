name: PR47 Live UI Proof

on:
  push:
    branches:
      - feat/evidence-complete-diagnosis
    paths:
      - 'scripts/pr47-live-ui-inventory.mjs'
      - 'scripts/pr47-live-ui-mixed-scenarios.mjs'
      - '.github/workflows/pr47-live-ui-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  live-ui-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_BASE_URL: https://tt-confidence-hub-git-feat-evi-31b8c6-relief-works-technologies.vercel.app
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify temporary proof credentials are configured
        shell: bash
        run: |
          if [ -z "$RI_PROOF_EMAIL" ] || [ -z "$RI_PROOF_PASSWORD" ]; then
            echo "::error::Specialist proof credentials are missing."
            exit 1
          fi

      - name: Inspect preview auth mode
        run: |
          echo "AUTH_MODE_BEGIN"
          curl -fsS "$SMOKE_BASE_URL/api/auth/mode"
          echo
          echo "AUTH_MODE_END"

      - name: Verify Preview backend authority
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.SMOKE_BASE_URL.replace(/\/$/, "");
          const response = await fetch(base + "/api/proof-environment");
          const text = await response.text();
          if (!response.ok) throw new Error(`Preview environment probe failed: ${response.status} ${text}`);
          const body = JSON.parse(text);
          console.log("PREVIEW_ENVIRONMENT=" + JSON.stringify({
            vercelEnv: body.vercelEnv,
            supabaseProjectRef: body.supabaseProjectRef,
            requiredEnv: body.requiredEnv,
          }));
          if (body.vercelEnv !== "preview") throw new Error("Expected Vercel preview environment");
          if (!["jftlxeacphvbnhbsbpxc","tzgkiaiwnhmnzznvmbfg"].includes(body.supabaseProjectRef)) {
            throw new Error("Preview is not connected to an approved Proof Supabase project");
          }
          if (body?.requiredEnv?.SUPABASE_SERVICE_ROLE_KEY !== true) {
            throw new Error("SUPABASE_SERVICE_ROLE_KEY is missing from the Preview environment");
          }
          NODE

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Use canonical Preview environment probe
        run: |
          sed -i 's#/api/__proof/environment#/api/proof-environment#g' scripts/pr47-live-ui-inventory.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/pr47-live-ui-inventory.mjs")
          text = path.read_text()
          needle = '  const podText = await podResponse.text();\n'
          insert = needle + '  console.log("PR47_POD_RAW=" + podText);\n'
          if needle not in text:
              raise SystemExit("pod response anchor not found")
          path.write_text(text.replace(needle, insert, 1))
          PY

      - name: Run authenticated PR47 live UI inventory
        run: node scripts/pr47-live-ui-inventory.mjs

      - name: Run PR47 live mixed-scenario UI proof
        run: node scripts/pr47-live-ui-mixed-scenarios.mjs

      - name: Upload PR47 live UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr47-live-ui-proof
          path: artifacts/pr47-live-ui-proof
          if-no-files-found: warn
