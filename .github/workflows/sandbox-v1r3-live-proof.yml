name: Sandbox V1R3 Stateful Live Proof

on:
  push:
    branches:
      - proof/sandbox-v1r3-stateful-environment
    paths:
      - '.github/workflows/sandbox-v1r3-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  sandbox-v1r3-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_BASE_URL: https://tt-confidence-js1ro5n7d-relief-works-technologies.vercel.app
      PROOF_EXPECTED_APP_SHA: 9a728de993641e5f4a6bcfd20bb1fb75b181547b
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RI_PROOF_ASSIGNMENT_ID: 836a839f-2f29-45c7-b8c2-aa501c95e1b0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run authenticated V1R3 longitudinal journey
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const baseUrl = String(process.env.SMOKE_BASE_URL || "").replace(/\/$/, "");
          const email = String(process.env.RI_PROOF_EMAIL || "").trim();
          const password = String(process.env.RI_PROOF_PASSWORD || "");
          const tutorAssignmentId = String(process.env.RI_PROOF_ASSIGNMENT_ID || "").trim();
          const expectedCommit = String(process.env.PROOF_EXPECTED_APP_SHA || "").trim();
          const bypass = String(process.env.VERCEL_AUTOMATION_BYPASS_SECRET || "").trim();
          assert.ok(baseUrl && email && password && tutorAssignmentId && expectedCommit);

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1100 },
            ...(bypass ? { extraHTTPHeaders: { "x-vercel-protection-bypass": bypass } } : {}),
          });
          const page = await context.newPage();
          const pageErrors = [];
          page.on("pageerror", (error) => pageErrors.push(String(error?.stack || error)));

          async function browserRequest(path, options = {}) {
            return await page.evaluate(async ({ path, options }) => {
              const response = await fetch(path, {
                credentials: "include",
                ...options,
                headers: {
                  "content-type": "application/json",
                  ...(options.headers || {}),
                },
              });
              return {
                ok: response.ok,
                status: response.status,
                text: await response.text(),
              };
            }, { path, options });
          }

          function parse(response, label) {
            assert.ok(response.ok, label + " failed: " + response.status + " " + response.text);
            return JSON.parse(response.text);
          }

          function assertNoPrivateKeys(value, label) {
            const forbidden = [];
            const walk = (node, path = "") => {
              if (!node || typeof node !== "object") return;
              for (const [key, child] of Object.entries(node)) {
                const full = path ? path + "." + key : key;
                if (
                  /canonical/i.test(key) ||
                  /outcome[_-]?key/i.test(key) ||
                  /public[_-]?ref/i.test(key) ||
                  /trajectory[_-]?seed/i.test(key)
                ) {
                  forbidden.push(full);
                }
                walk(child, full);
              }
            };
            walk(value);
            assert.deepEqual(forbidden, [], label + " leaked private keys: " + forbidden.join(", "));
          }

          await page.goto(baseUrl, { waitUntil: "domcontentloaded", timeout: 90000 });

          // The deployment SHA is independently pinned in this temporary harness and
          // verified through the Vercel deployment record before the run. Some preview
          // deployments do not expose /api/proof-environment, so the authenticated
          // product APIs are the live proof authority here.
          assert.equal(expectedCommit, "9a728de993641e5f4a6bcfd20bb1fb75b181547b");

          const signin = parse(
            await browserRequest("/api/auth/signin", {
              method: "POST",
              body: JSON.stringify({ email, password, expectedRole: "tutor" }),
            }),
            "Specialist login",
          );
          assert.equal(String(signin?.dbUser?.role || "").toLowerCase(), "tutor");

          async function getEnvironment() {
            const body = parse(
              await browserRequest(
                "/api/tutor/sandbox-environment?tutorAssignmentId=" +
                  encodeURIComponent(tutorAssignmentId),
              ),
              "Sandbox environment",
            );
            assert.equal(body.bankKey, "sandbox_stateful_environment");
            assert.equal(body.bankVersion, 1);
            assert.equal(body.studentStateAuthoritative, false);
            assert.equal(body.evidenceScope, "sandbox");
            assertNoPrivateKeys(body, "Sandbox environment payload");
            return body;
          }

          async function getHistory() {
            const body = parse(
              await browserRequest(
                "/api/tutor/sandbox-environment/history?tutorAssignmentId=" +
                  encodeURIComponent(tutorAssignmentId),
              ),
              "Sandbox history",
            );
            assert.equal(body.studentStateAuthoritative, false);
            assert.equal(body.evidenceScope, "sandbox");
            assertNoPrivateKeys(body, "Sandbox history payload");
            return body;
          }

          const first = await getEnvironment();
          assert.equal(first.status, "rep_ready");
          assert.equal(first.readiness.policyAvailable, true);
          assert.equal(first.readiness.policyStatus, "candidate");
          assert.equal(first.readiness.practicalsReady, false);
          assert.equal(first.readiness.automaticTransition, false);
          assert.equal(first.readiness.nextStage, "practicals");
          assert.ok(first.rep?.studentBehavior);
          assert.ok(Array.isArray(first.rep?.fields) && first.rep.fields.length > 0);
          assert.ok(first.sessionProgress?.totalReps > 0);

          const repeated = await getEnvironment();
          assert.equal(repeated.eventFormId, first.eventFormId);
          assert.equal(repeated.eventSequence, first.eventSequence);
          assert.equal(repeated.rep.studentBehavior, first.rep.studentBehavior);

          const trajectoryId = first.trajectoryId;
          const sessionNumber = first.sessionNumber;
          let submittedReps = 0;
          let lastResult = null;

          while (submittedReps < 20) {
            const form = submittedReps === 0 ? first : await getEnvironment();
            assert.equal(form.status, "rep_ready");
            assert.equal(form.trajectoryId, trajectoryId);
            assert.equal(form.sessionNumber, sessionNumber);

            const observations = Object.fromEntries(
              form.rep.fields.map((field) => [
                field.fieldKey,
                {
                  optionId: field.options[0].optionId,
                  evidenceStatus: "observed",
                },
              ]),
            );

            const submission = {
              tutorAssignmentId,
              bankVersion: form.bankVersion,
              trajectoryId: form.trajectoryId,
              eventSequence: form.eventSequence,
              eventFormId: form.eventFormId,
              submission: {
                interventionEvent: "none",
                observations,
                ...(form.rep.inheritedRescueSignal ? { inheritedRescueSignal: "none" } : {}),
              },
            };

            const prerequisiteRequired = form.rep.fields.some((field) => {
              const chosen = field.options[0];
              return Boolean(chosen?.requiresPrerequisiteSentinel);
            });
            if (prerequisiteRequired && form.rep.prerequisiteSentinel) {
              submission.submission.prerequisiteSentinel = "held";
            }

            const result = parse(
              await browserRequest("/api/tutor/sandbox-environment/rep", {
                method: "POST",
                body: JSON.stringify(submission),
              }),
              "Sandbox rep submit",
            );
            assert.equal(result.studentStateAuthoritative, false);
            assert.equal(result.evidenceScope, "sandbox");
            assert.equal(result.trajectoryId, undefined);
            assertNoPrivateKeys(result, "Sandbox rep result");
            assert.ok(result.eventId);
            assert.ok(result.eventSequence >= 1);
            submittedReps += 1;
            lastResult = result;
            if (result.sessionCompleted) break;
          }

          assert.ok(lastResult?.sessionCompleted, "A complete Sandbox Training session was not reached.");
          assert.equal(submittedReps, first.sessionProgress.totalReps);

          const history = await getHistory();
          assert.equal(history.trajectory.id, trajectoryId);
          assert.ok(history.trajectory.completedRepCount >= submittedReps);
          assert.ok(history.sessions.length >= 1);
          assert.equal(history.sessions[0].sessionNumber, sessionNumber);
          assert.equal(history.readiness.policyStatus, "candidate");
          assert.equal(history.readiness.practicalsReady, false);
          assert.equal(history.readiness.automaticTransition, false);
          assert.ok(history.readiness.layers.length === 5);

          await page.goto(baseUrl + "/operational/specialist/sandbox", {
            waitUntil: "domcontentloaded",
            timeout: 90000,
          });
          try {
            await page.getByText("Stateful Sandbox").waitFor({
              state: "visible",
              timeout: 30000,
            });
            await page.getByText("Sandbox capability evidence").waitFor({
              state: "visible",
              timeout: 30000,
            });
          } catch (error) {
            const bodyText = await page.locator("body").innerText();
            console.log("SANDBOX_V1R3_UI_BODY=" + bodyText.slice(0, 6000));
            console.log("SANDBOX_V1R3_PAGE_ERRORS=" + JSON.stringify(pageErrors));
            throw error;
          }

          console.log("SANDBOX_V1R3_LONGITUDINAL_PASS=" + JSON.stringify({
            bankVersion: first.bankVersion,
            trajectoryPersisted: true,
            repeatedFormStable: true,
            sessionNumber,
            submittedReps,
            completedSessionPersisted: history.sessions.length >= 1,
            capabilityLayers: history.readiness.layers.length,
            policyStatus: history.readiness.policyStatus,
            practicalsReady: history.readiness.practicalsReady,
            automaticTransition: history.readiness.automaticTransition,
            canonicalLeakage: false,
            uiRendered: true,
          }));

          await browser.close();
          NODE
