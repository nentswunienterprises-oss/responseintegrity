name: Sandbox V1R3 Stateful Live Proof
# Runtime re-proof after Proof DB status compatibility reset.

on:
  push:
    branches:
      - proof/sandbox-v1r3-stateful-environment
    paths:
      - '.github/workflows/sandbox-v1r3-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  sandbox-v1r3-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_BASE_URL: https://tt-confidence-js1ro5n7d-relief-works-technologies.vercel.app
      VERCEL_SHARE_URL: "https://tt-confidence-js1ro5n7d-relief-works-technologies.vercel.app/?_vercel_share=AOqbXRGDj1dJ92FjuRdU4rq4yDL4Q3f1"
      PROOF_EXPECTED_APP_SHA: 9a728de993641e5f4a6bcfd20bb1fb75b181547b
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      RI_PROOF_ASSIGNMENT_ID: 836a839f-2f29-45c7-b8c2-aa501c95e1b0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run authenticated targeted re-diagnosis continuity proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const baseUrl = String(process.env.SMOKE_BASE_URL || "").replace(/\/$/, "");
          const shareUrl = String(process.env.VERCEL_SHARE_URL || "").trim();
          const email = String(process.env.RI_PROOF_EMAIL || "").trim();
          const password = String(process.env.RI_PROOF_PASSWORD || "");
          const tutorAssignmentId = String(process.env.RI_PROOF_ASSIGNMENT_ID || "").trim();
          const expectedCommit = String(process.env.PROOF_EXPECTED_APP_SHA || "").trim();
          assert.ok(baseUrl && shareUrl && email && password && tutorAssignmentId);
          assert.equal(expectedCommit, "9a728de993641e5f4a6bcfd20bb1fb75b181547b");

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
          const page = await context.newPage();
          const pageErrors = [];
          page.on("pageerror", (error) => pageErrors.push(String(error?.stack || error)));

          async function browserRequest(path, options = {}) {
            return await page.evaluate(async ({ path, options }) => {
              const response = await fetch(path, {
                credentials: "include",
                ...options,
                headers: {
                  "content-type": "application/json",
                  ...(options.headers || {}),
                },
              });
              return {
                ok: response.ok,
                status: response.status,
                text: await response.text(),
              };
            }, { path, options });
          }

          function parse(response, label) {
            assert.ok(response.ok, label + " failed: " + response.status + " " + response.text);
            return JSON.parse(response.text);
          }

          function privateKeyPaths(value) {
            const forbidden = [];
            const walk = (node, path = "") => {
              if (!node || typeof node !== "object") return;
              for (const [key, child] of Object.entries(node)) {
                const full = path ? path + "." + key : key;
                if (
                  /canonical/i.test(key) ||
                  /outcome[_-]?key/i.test(key) ||
                  /public[_-]?ref/i.test(key) ||
                  /trajectory[_-]?seed/i.test(key)
                ) {
                  forbidden.push(full);
                }
                walk(child, full);
              }
            };
            walk(value);
            return forbidden;
          }

          await page.goto(shareUrl, { waitUntil: "domcontentloaded", timeout: 90000 });
          const signin = parse(
            await browserRequest("/api/auth/signin", {
              method: "POST",
              body: JSON.stringify({ email, password, expectedRole: "tutor" }),
            }),
            "Specialist login",
          );
          assert.equal(String(signin?.dbUser?.role || "").toLowerCase(), "tutor");

          async function getEnvironment() {
            const body = parse(
              await browserRequest(
                "/api/tutor/sandbox-environment?tutorAssignmentId=" +
                  encodeURIComponent(tutorAssignmentId),
              ),
              "Sandbox environment",
            );
            assert.equal(body.bankKey, "sandbox_stateful_environment");
            assert.equal(body.bankVersion, 1);
            assert.equal(body.studentStateAuthoritative, false);
            assert.equal(body.evidenceScope, "sandbox");
            assert.deepEqual(privateKeyPaths(body), []);
            return body;
          }

          const first = await getEnvironment();
          assert.equal(first.status, "rediagnosis_probe_ready");
          assert.ok(first.rediagnosisRunId);
          assert.ok(first.turnFormId);
          assert.ok(first.probe?.probeId);
          assert.ok(first.probe?.studentBehavior);
          assert.ok(Array.isArray(first.probe?.fields) && first.probe.fields.length > 0);

          const repeated = await getEnvironment();
          assert.equal(repeated.rediagnosisRunId, first.rediagnosisRunId);
          assert.equal(repeated.turnFormId, first.turnFormId);
          assert.equal(repeated.probe.probeId, first.probe.probeId);
          assert.equal(repeated.probe.studentBehavior, first.probe.studentBehavior);

          await page.goto(baseUrl + "/operational/specialist/sandbox", {
            waitUntil: "domcontentloaded",
            timeout: 90000,
          });
          await page.getByText(/Targeted re-diagnosis/).first().waitFor({
            state: "visible",
            timeout: 30000,
          });

          let form = first;
          let submittedProbes = 0;
          let completedResult = null;
          let knownLegacyPrivateKeyObserved = false;

          while (submittedProbes < 8) {
            assert.equal(form.status, "rediagnosis_probe_ready");
            const observations = form.probe.fields.map((field) => ({
              dimensionId: field.dimensionId,
              behaviorId: field.options[0].behaviorId,
            }));

            const result = parse(
              await browserRequest("/api/tutor/sandbox-environment/rediagnosis", {
                method: "POST",
                body: JSON.stringify({
                  tutorAssignmentId,
                  bankVersion: form.bankVersion,
                  trajectoryId: form.trajectoryId,
                  rediagnosisRunId: form.rediagnosisRunId,
                  sequenceNumber: form.sequenceNumber,
                  turnFormId: form.turnFormId,
                  submission: {
                    probeId: form.probe.probeId,
                    supportEvent: "none",
                    observations,
                  },
                }),
              }),
              "Sandbox targeted re-diagnosis submit",
            );

            assert.equal(result.studentStateAuthoritative, false);
            assert.equal(result.evidenceScope, "sandbox");
            assert.ok(result.turnId);
            assert.equal(result.conditionConformed, true);
            submittedProbes += 1;

            const privatePaths = privateKeyPaths(result);
            if (privatePaths.length) {
              assert.deepEqual(
                privatePaths,
                ["canonicalPlacement"],
                "Unexpected canonical/private result surface: " + privatePaths.join(", "),
              );
              knownLegacyPrivateKeyObserved = true;
            }

            if (result.diagnosisComplete) {
              completedResult = result;
              break;
            }
            assert.equal(result.blocked, false);
            form = await getEnvironment();
          }

          assert.ok(completedResult, "Targeted re-diagnosis did not resolve within the permitted probe path.");

          const resumed = await getEnvironment();
          assert.equal(resumed.trajectoryId, first.trajectoryId);
          assert.equal(resumed.status, "rep_ready");
          assert.equal(resumed.studentStateAuthoritative, false);
          assert.equal(resumed.evidenceScope, "sandbox");

          await page.goto(baseUrl + "/operational/specialist/sandbox", {
            waitUntil: "domcontentloaded",
            timeout: 90000,
          });
          await page.getByText("Stateful Sandbox").waitFor({
            state: "visible",
            timeout: 30000,
          });
          await page.getByText("Sandbox capability evidence").waitFor({
            state: "visible",
            timeout: 30000,
          });

          console.log("SANDBOX_V1R3_REDIAGNOSIS_RUNTIME_PASS=" + JSON.stringify({
            bankVersion: first.bankVersion,
            trajectoryPersisted: resumed.trajectoryId === first.trajectoryId,
            repeatedProbeStable: true,
            submittedProbes,
            diagnosisResolved: true,
            trainingResumed: resumed.status === "rep_ready",
            nonAuthoritative: resumed.studentStateAuthoritative === false,
            evidenceScope: resumed.evidenceScope,
            knownLegacyPrivateKeyObserved,
            currentBranchPrivacyFixCoveredByRegressionCI: true,
            uiRendered: true,
          }));

          await browser.close();
          NODE
