name: Practicals Acceptance CI
on:
  pull_request:
    paths:
      - 'shared/practicalExecuteChallenge*'
      - 'shared/capabilityPracticalEvidence.ts'
      - 'shared/practicalEntryGate*'
      - 'server/sandboxEnvironment.ts'
      - 'client/src/components/sandbox/SandboxReadinessAssessmentCard.tsx'
      - 'server/practicalExecuteChallenge.ts'
      - 'server/capabilityPracticalEvidence.ts'
      - 'server/routes/capabilityPracticalEvidence.ts'
      - 'client/src/components/practicals/**'
      - 'client/src/pages/operational/tutor/practicals.tsx'
      - 'client/src/pages/operational/td/practicals-review.tsx'
      - 'migrations/20261009_practicals_evidence_stage_v1.sql'
      - 'config/production-migration-authority.json'
      - '.github/workflows/practicals-acceptance-ci.yml'
      - 'scripts/practicalsMigrationIntegration.test.ts'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'shared/practicalExecuteChallenge*'
      - 'server/practicalExecuteChallenge.ts'
      - 'server/capabilityPracticalEvidence.ts'
      - 'client/src/components/practicals/**'
      - 'migrations/20261009_practicals_evidence_stage_v1.sql'
      - 'package.json'
permissions:
  contents: read
jobs:
  practicals-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: practicals_ci
          POSTGRES_DB: practicals_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d practicals_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Versioned adaptive Execute contract and security boundaries
        run: npm run test:practicals
      - name: PostgreSQL schema and immutable evidence integration
        run: npm run test:practicals-db
        env:
          PRACTICALS_CI_DATABASE_URL: postgresql://postgres:practicals_ci@localhost:5432/practicals_ci
      - name: Vercel API bundle
        run: npm run build:vercel-api
      - name: Frontend bundle
        run: npm run build:frontend
