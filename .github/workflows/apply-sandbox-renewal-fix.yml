name: Apply sandbox renewal fix
on:
  push:
    branches:
      - fix/td-dossier-legacy-labels
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Activate sandbox renewal entitlements') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply renewal handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("server/routes.ts")
          s = p.read_text()
          old = '''          if (isRenewalPaymentTransaction(transaction)) {
            return res.status(503).json({
              message: "Sandbox renewal confirmation is not available in Emergency DB mode yet.",
            });
          }'''
          paid = '''          if (isRenewalPaymentTransaction(transaction)) {
            const renewedMonth = await applyRenewalTransactionToMembershipMonth(transaction);
            if (!renewedMonth) {
              return res.status(500).json({ message: "Failed to activate sandbox renewal package" });
            }
            return res.json({
              message: "Sandbox renewal package activated.",
              paymentStatus: "PAID",
              membershipMonth: renewedMonth,
              sandbox: true,
            });
          }'''
          if s.count(old) != 2:
              raise SystemExit(f"expected 2 renewal guards, found {s.count(old)}")
          s = s.replace(old, paid)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts
          git commit -m "Activate sandbox renewal entitlements in emergency mode"
          git push
