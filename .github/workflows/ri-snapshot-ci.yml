name: Response Snapshot CI

on:
  pull_request:
    paths:
      - "shared/responseSnapshot.ts"
      - "shared/responseSnapshot.test.ts"
      - "shared/responseIntegrityDrillRegistry.ts"
      - "shared/responseIntegrityDrillRegistry.test.ts"
      - "shared/responseIntegrityEvidenceLedger.ts"
      - "shared/responseIntegrityEvidenceLedger.test.ts"
      - "shared/adaptiveDiagnosis.ts"
      - "shared/evidenceCompleteDiagnosis.ts"
      - "shared/evidenceCompleteDiagnosis.test.ts"
      - "shared/evidenceCompleteDiagnosisSubmission.ts"
      - "shared/evidenceCompleteDiagnosisSubmission.test.ts"
      - "server/evidenceCompleteDiagnosisRoutes.ts"
      - "server/index.ts"
      - "api/index.ts"
      - "client/src/components/tutor/EvidenceCompleteDiagnosisRunner.tsx"
      - "client/src/components/tutor/IntroSessionRoute.tsx"
      - "client/src/App.tsx"
      - "migrations/2026-09-18_evidence_complete_diagnosis_runs.sql"
      - "docs/evidence-complete-diagnosis-contract.md"
      - "server/routes.ts"
      - "client/src/components/tutor/IntroSessionDrillRunner.tsx"
      - "client/src/components/tutor/ViewTrackingSystemsDialog.tsx"
      - ".github/workflows/ri-snapshot-ci.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "shared/responseSnapshot.ts"
      - "shared/responseSnapshot.test.ts"
      - "shared/responseIntegrityDrillRegistry.ts"
      - "shared/responseIntegrityDrillRegistry.test.ts"
      - "shared/responseIntegrityEvidenceLedger.ts"
      - "shared/responseIntegrityEvidenceLedger.test.ts"
      - "shared/adaptiveDiagnosis.ts"
      - "shared/evidenceCompleteDiagnosis.ts"
      - "shared/evidenceCompleteDiagnosis.test.ts"
      - "shared/evidenceCompleteDiagnosisSubmission.ts"
      - "shared/evidenceCompleteDiagnosisSubmission.test.ts"
      - "server/evidenceCompleteDiagnosisRoutes.ts"
      - "server/index.ts"
      - "api/index.ts"
      - "client/src/components/tutor/EvidenceCompleteDiagnosisRunner.tsx"
      - "client/src/components/tutor/IntroSessionRoute.tsx"
      - "client/src/App.tsx"
      - "migrations/2026-09-18_evidence_complete_diagnosis_runs.sql"
      - "docs/evidence-complete-diagnosis-contract.md"
      - "server/routes.ts"
      - "client/src/components/tutor/IntroSessionDrillRunner.tsx"
      - "client/src/components/tutor/ViewTrackingSystemsDialog.tsx"
      - ".github/workflows/ri-snapshot-ci.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  ri-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run check:ri-snapshot

      - run: npm run test:ri-snapshot

