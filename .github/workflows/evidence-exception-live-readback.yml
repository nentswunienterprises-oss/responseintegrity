name: Evidence Exception Authenticated Readback
on:
  push:
    branches: [fix/preview-training-session-authority]
    paths:
      - .github/workflows/evidence-exception-live-readback.yml
      - scripts/evidenceExceptionLiveReadback.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 25
    env:
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable Preview runtime matches current app sources
        run: git diff --exit-code 59a5875514941fb228e51e79fce24b41ae962c8a HEAD -- client server shared package.json package-lock.json vite.config.ts tsconfig.json ":(exclude)client/index.html" ":(exclude)client/public/google-homepage.html" ":(exclude)client/public/ri-symbol-logo.svg" ":(exclude)client/src/components/RISymbolLogo.tsx" ":(exclude)client/src/lib/google-homepage.test.ts" ":(exclude)client/src/lib/publicSeo.ts"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/evidenceExceptionLiveReadback.mjs
