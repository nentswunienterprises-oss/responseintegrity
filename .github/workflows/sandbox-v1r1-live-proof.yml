name: Sandbox V1R1 Live Proof

on:
  push:
    branches:
      - proof/sandbox-v1r1-reconciliation
    paths:
      - '.github/workflows/sandbox-v1r1-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  live-sandbox-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_BASE_URL: https://tt-confidence-878c1pyrs-relief-works-technologies.vercel.app
      VERCEL_SHARE_URL: https://tt-confidence-878c1pyrs-relief-works-technologies.vercel.app/?_vercel_share=EvlzE717ZYJgSlZZ9rJ53quVmLhUh92M
      PROOF_EXPECTED_APP_SHA: 5a48dd9054ba7d129e4caa5c76d02349e6443ee0
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      RI_PROOF_ASSIGNMENT_ID: 836a839f-2f29-45c7-b8c2-aa501c95e1b0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run authenticated deterministic Sandbox journey
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const baseUrl = String(process.env.SMOKE_BASE_URL || "").replace(/\/$/, "");
          const shareUrl = String(process.env.VERCEL_SHARE_URL || "").trim();
          const email = String(process.env.RI_PROOF_EMAIL || "").trim();
          const password = String(process.env.RI_PROOF_PASSWORD || "");
          const tutorAssignmentId = String(process.env.RI_PROOF_ASSIGNMENT_ID || "").trim();
          const expectedCommit = String(process.env.PROOF_EXPECTED_APP_SHA || "").trim();
          assert.ok(baseUrl && shareUrl && email && password && tutorAssignmentId && expectedCommit);

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
          const page = await context.newPage();

          await page.goto(shareUrl, { waitUntil: "domcontentloaded", timeout: 60000 });

          const proof = await page.request.get(baseUrl + "/api/proof-environment", { timeout: 60000 });
          const proofText = await proof.text();
          assert.ok(proof.ok(), "Proof environment failed: " + proof.status() + " " + proofText);
          const proofBody = JSON.parse(proofText);
          assert.equal(proofBody.vercelEnv, "preview");
          assert.equal(proofBody.supabaseProjectRef, "jftlxeacphvbnhbsbpxc");
          assert.equal(proofBody.commitSha, expectedCommit);

          const signin = await page.request.post(baseUrl + "/api/auth/signin", {
            data: { email, password, expectedRole: "tutor" },
            timeout: 60000,
          });
          const signinText = await signin.text();
          assert.ok(signin.ok(), "Login failed: " + signin.status() + " " + signinText);
          const signinBody = JSON.parse(signinText);
          assert.equal(String(signinBody?.dbUser?.role || "").toLowerCase(), "tutor");

          async function loadForm() {
            const response = await page.request.get(
              baseUrl + "/api/tutor/sandbox-simulation?tutorAssignmentId=" +
                encodeURIComponent(tutorAssignmentId),
              { timeout: 60000 },
            );
            const text = await response.text();
            assert.ok(response.ok(), "Sandbox form failed: " + response.status() + " " + text);
            const body = JSON.parse(text);
            assert.equal(body.bankKey, "sandbox_observation_foundation");
            assert.equal(body.bankVersion, 1);
            assert.equal(body.scenario.phase, "Clarity");
            assert.equal(body.scenario.sets.length, 2);
            assert.equal(body.scenario.sets.reduce(
              (sum, set) => sum + set.reps.reduce((repSum, rep) => repSum + rep.fields.length, 0),
              0,
            ), 24);
            const serialized = JSON.stringify(body);
            assert.equal(/"canonicalOutcome"\s*:/.test(serialized), false, "Canonical outcome leaked");
            assert.equal(/"observations"\s*:/.test(serialized), false, "Canonical observations leaked");
            assert.equal(/"correctOptionKeys"\s*:/.test(serialized), false, "Answer keys leaked");
            return body;
          }

          const first = await loadForm();
          assert.equal(first.attemptNumber, 1);
          const repeated = await loadForm();
          assert.equal(repeated.scenarioFormId, first.scenarioFormId);
          assert.equal(repeated.scenario.key, first.scenario.key);

          const submission = {
            sets: first.scenario.sets.map((set) => ({
              setId: set.setId,
              reps: set.reps.map((rep) => ({
                repNumber: rep.repNumber,
                observations: Object.fromEntries(
                  rep.fields.map((field) => [
                    field.fieldKey,
                    {
                      optionId: field.options[0].optionId,
                      evidenceStatus: "observed",
                    },
                  ]),
                ),
              })),
            })),
          };

          const submit = await page.request.post(
            baseUrl + "/api/tutor/sandbox-simulation/attempt",
            {
              data: {
                tutorAssignmentId,
                bankVersion: first.bankVersion,
                scenarioFormId: first.scenarioFormId,
                submission,
              },
              timeout: 60000,
            },
          );
          const submitText = await submit.text();
          assert.ok(submit.ok(), "Sandbox submit failed: " + submit.status() + " " + submitText);
          const result = JSON.parse(submitText);
          assert.ok(result.attemptId, "Sandbox attempt did not persist");
          assert.equal(result.bankVersion, 1);
          assert.equal(result.attemptNumber, 1);
          assert.equal(result.totalObservations, 24);
          assert.ok(Number.isFinite(result.observationFidelityPercent));
          assert.equal(typeof result.systemOutcomeMatched, "boolean");
          assert.equal(result.studentStateAuthoritative, false);
          assert.equal(result.evidenceScope, "sandbox");
          assert.equal("canonicalOutcome" in result, false, "Canonical system truth leaked in public result");

          const history = await page.request.get(
            baseUrl + "/api/tutor/sandbox-simulation/history?tutorAssignmentId=" +
              encodeURIComponent(tutorAssignmentId),
            { timeout: 60000 },
          );
          const historyText = await history.text();
          assert.ok(history.ok(), "Sandbox history failed: " + history.status() + " " + historyText);
          const historyBody = JSON.parse(historyText);
          const persisted = (historyBody.attempts || []).find((attempt) => attempt.id === result.attemptId);
          assert.ok(persisted, "Sandbox attempt missing from persisted history");
          assert.equal(persisted.studentStateAuthoritative, false);
          assert.equal(persisted.evidenceScope, "sandbox");

          const second = await loadForm();
          assert.equal(second.attemptNumber, 2);
          assert.notEqual(second.scenarioFormId, first.scenarioFormId);
          assert.notEqual(second.scenario.key, first.scenario.key, "Deterministic retry did not rotate scenario");

          await page.goto(baseUrl + "/operational/specialist/sandbox", {
            waitUntil: "domcontentloaded",
            timeout: 90000,
          });
          await page.getByText(/Sandbox ·/).first().waitFor({ state: "visible", timeout: 60000 });

          console.log("SANDBOX_V1R1_LIVE_PROOF_PASS=" + JSON.stringify({
            bankKey: first.bankKey,
            bankVersion: first.bankVersion,
            firstScenario: first.scenario.key,
            totalObservations: result.totalObservations,
            observationFidelityPercent: result.observationFidelityPercent,
            systemOutcomeMatched: result.systemOutcomeMatched,
            persistedAttemptId: result.attemptId,
            privateCanonicalLeakage: false,
            studentStateAuthoritative: result.studentStateAuthoritative,
            retryAttemptNumber: second.attemptNumber,
            retryScenario: second.scenario.key,
            retryRotated: second.scenario.key !== first.scenario.key,
            uiRendered: true,
          }));

          await browser.close();
          NODE
