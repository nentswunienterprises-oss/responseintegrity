name: COO Production Link UI Smoke

on:
  push:
    branches:
      - feat/demand-production-gateway
    paths:
      - 'client/src/pages/executive/coo/dashboard.tsx'
      - 'server/productionLinkUrls.ts'
      - 'server/productionLinkUrls.test.ts'
      - 'scripts/coo-production-link-ui-smoke.mjs'
      - '.github/workflows/coo-production-link-ui-smoke.yml'
  workflow_dispatch:

concurrency:
  group: coo-production-link-ui-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: https://tt-confidence-hub-git-feat-dem-d053fe-relief-works-technologies.vercel.app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run COO Production Link UI smoke
        run: node scripts/coo-production-link-ui-smoke.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coo-production-link-ui-smoke
          path: artifacts/coo-production-link-ui-smoke
          if-no-files-found: warn
