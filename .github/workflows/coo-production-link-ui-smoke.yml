name: COO Production Link UI Smoke

on:
  push:
    branches:
      - feat/demand-production-gateway
    paths:
      - 'client/src/pages/executive/coo/dashboard.tsx'
      - 'server/productionLinkUrls.ts'
      - 'server/productionLinkUrls.test.ts'
      - 'scripts/coo-production-link-ui-smoke.mjs'
      - '.github/workflows/coo-production-link-ui-smoke.yml'
  workflow_dispatch:

concurrency:
  group: coo-production-link-ui-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: https://tt-confidence-hub-git-feat-dem-d053fe-relief-works-technologies.vercel.app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Align smoke to live gated parent entry
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "scripts/coo-production-link-ui-smoke.mjs";
          let source = fs.readFileSync(path, "utf8");
          const start = source.indexOf('  const signupCtas = parentPage.locator("[data-signup-link]");');
          const end = source.indexOf('  await parentContext.close();', start);
          if (start < 0 || end < 0) {
            throw new Error("Parent landing assertion block not found");
          }
          const replacement = `  checkpoint("canonical-link-opened-as-parent", {
            url: parentPage.url(),
            title: await parentPage.title(),
          });
          await parentPage.screenshot({
            path: path.join(evidenceDir, "03-parent-landing.png"),
            fullPage: true,
          });

          const intakeButton = parentPage
            .getByRole("button", { name: "Check Current Intake Window", exact: true })
            .first();
          await intakeButton.waitFor({ timeout: 30_000 });
          await intakeButton.click();
          await parentPage.waitForURL(/\\/client\\/intake/, { timeout: 30_000 });

          const intakeUrl = new URL(parentPage.url());
          assert.equal(intakeUrl.searchParams.get("production"), generatedCode);
          assert.equal(intakeUrl.searchParams.get("pipeline"), "demand");
          assert.equal(
            intakeUrl.searchParams.get("fastTrack"),
            null,
            "A normal COO Production Link must not unlock fast-track access",
          );
          await parentPage.getByText("Parent intake gateway", { exact: false }).waitFor({
            timeout: 30_000,
          });

          checkpoint("parent-reached-attributed-intake", {
            url: parentPage.url(),
            production: intakeUrl.searchParams.get("production"),
            pipeline: intakeUrl.searchParams.get("pipeline"),
            fastTrack: intakeUrl.searchParams.get("fastTrack"),
          });
          await parentPage.screenshot({
            path: path.join(evidenceDir, "04-attributed-intake.png"),
            fullPage: true,
          });

`;
          source = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(path, source);
          NODE

      - name: Run COO Production Link UI smoke
        run: node scripts/coo-production-link-ui-smoke.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coo-production-link-ui-smoke
          path: artifacts/coo-production-link-ui-smoke
          if-no-files-found: warn
