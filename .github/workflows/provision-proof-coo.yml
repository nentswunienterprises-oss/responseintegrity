name: Provision Proof COO

on:
  push:
    branches:
      - fix/preview-training-session-authority
    paths:
      - '.github/workflows/provision-proof-coo.yml'
      - '.github/scripts/provision-proof-coo.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROOF_BASE_URL: https://tt-confidence-hub-git-fix-prev-504b23-relief-works-technologies.vercel.app
      RI_PROOF_SPECIALIST_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_SPECIALIST_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      RI_PROOF_COO_PASSWORD: ${{ secrets.RI_PROOF_COO_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deployed Preview app SHA
        shell: bash
        run: |
          echo "PROOF_EXPECTED_APP_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Resolved deployed app SHA: $GITHUB_SHA"

      - name: Provision and verify Proof COO
        run: node .github/scripts/provision-proof-coo.mjs
