name: Capability Engine CI

on:
  pull_request:
    paths:
      - "shared/capability*.ts"
      - "server/capability*.ts"
      - "server/routes/capability*.ts"
      - "scripts/*capability*.ts"
      - "scripts/*Capability*.ts"
      - "client/src/pages/operational/**/capability*.tsx"
      - "client/src/pages/operational/**/capability*.test.ts"
      - "client/src/components/responseconditioning/DeepDiveDeterrent.tsx"
      - "client/src/capabilityStandaloneApp.tsx"
      - "client/src/main.tsx"
      - "migrations/*capability*.sql"
      - "server/index.ts"
      - "api/index.ts"
      - ".github/workflows/capability-engine-ci.yml"
  push:
    branches:
      - "feat/capability-engine-*"
    paths:
      - "shared/capability*.ts"
      - "server/capability*.ts"
      - "server/routes/capability*.ts"
      - "scripts/*capability*.ts"
      - "scripts/*Capability*.ts"
      - "client/src/pages/operational/**/capability*.tsx"
      - "client/src/pages/operational/**/capability*.test.ts"
      - "client/src/components/responseconditioning/DeepDiveDeterrent.tsx"
      - "client/src/capabilityStandaloneApp.tsx"
      - "client/src/main.tsx"
      - "migrations/*capability*.sql"
      - "server/index.ts"
      - "api/index.ts"
      - ".github/workflows/capability-engine-ci.yml"

jobs:
  capability-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capability Engine tests
        run: npx tsx --test shared/capability*.test.ts server/capability*.test.ts scripts/importPrivateCapabilityBankBoundary.test.ts client/src/pages/operational/tutor/capability*Boundary.test.ts
      - name: TypeScript check
        run: npm run check
