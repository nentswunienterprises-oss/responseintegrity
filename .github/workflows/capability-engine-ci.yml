name: Capability Engine CI

on:
  pull_request:
    paths:
      - "shared/capabilityEngine.ts"
      - "shared/capabilityEngine.test.ts"
      - "shared/capabilityPracticalEvidence.ts"
      - "shared/capabilityPracticalEvidence.test.ts"
      - "shared/capabilityReadiness.ts"
