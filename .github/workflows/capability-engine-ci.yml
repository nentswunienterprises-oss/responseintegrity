      - "server/capabilityEngineBoundary.test.ts"
      - "server/capabilityPracticalEvidence.ts"
      - "server/capabilityPracticalEvidenceBoundary.test.ts"
      - "server/capabilityReadiness.ts"
      - "server/capabilityOralDefense.ts"
      - "server/capabilityOralDefenseCore.ts"
      - "server/capabilityOralDefenseCore.test.ts"
      - "server/capabilityOralDefenseBoundary.test.ts"
      - "server/capabilityShadowJourney.test.ts"
      - "server/capabilityRouteRegistration.test.ts"
      - "server/routes/capabilityEngine.ts"
      - "server/routes/capabilityPracticalEvidence.ts"
      - "server/routes/capabilityOralDefense.ts"
      - "client/src/pages/operational/tutor/capability-assessment.tsx"
      - "client/src/pages/operational/tutor/capability-practicals.tsx"
      - "client/src/pages/operational/capability-practical-review.tsx"
      - "client/src/pages/operational/capability-oral-defense-review.tsx"
      - "client/src/pages/operational/tutor/capabilityAssessmentBoundary.test.ts"
      - "client/src/pages/operational/tutor/capabilityPracticalsBoundary.test.ts"
      - "client/src/pages/operational/capabilityOralDefenseBoundary.test.ts"
      - "client/src/capabilityStandaloneApp.tsx"
      - "client/src/components/responseconditioning/DeepDiveDeterrent.tsx"
      - "client/src/main.tsx"
      - "migrations/2026-09-11_add_capability_assessment_attempts.sql"
      - "server/index.ts"
      - "api/index.ts"
      - ".github/workflows/capability-engine-ci.yml"
  push:
    branches:
      - "feat/capability-engine-*"
    paths:
      - "shared/capabilityEngine.ts"
      - "shared/capabilityEngine.test.ts"
      - "shared/capabilityPracticalEvidence.ts"
      - "shared/capabilityPracticalEvidence.test.ts"
      - "shared/capabilityReadiness.ts"
      - "shared/capabilityReadiness.test.ts"
      - "shared/capabilityEvidenceSelection.ts"
      - "shared/capabilityEvidenceSelection.test.ts"
      - "shared/capabilityReviewerScope.ts"
      - "shared/capabilityReviewerScope.test.ts"
      - "shared/capabilityOralDefense.ts"
      - "shared/capabilityOralDefense.test.ts"
      - "shared/capabilityAssessments*.ts"
      - "shared/capabilityAssessmentBank.ts"
      - "server/capabilityEngine.ts"
      - "server/capabilityBank.ts"
      - "server/capabilityPublicProjection.ts"
      - "server/capabilityPublicProjection.test.ts"
      - "server/capabilityFormGeneration.ts"
      - "server/capabilityFormGeneration.test.ts"
      - "server/capabilityEngineBoundary.test.ts"
      - "server/capabilityPracticalEvidence.ts"
      - "server/capabilityPracticalEvidenceBoundary.test.ts"
      - "server/capabilityReadiness.ts"
      - "server/capabilityOralDefense.ts"
      - "server/capabilityOralDefenseCore.ts"
      - "server/capabilityOralDefenseCore.test.ts"
      - "server/capabilityOralDefenseBoundary.test.ts"
      - "server/capabilityShadowJourney.test.ts"
      - "server/capabilityRouteRegistration.test.ts"
      - "server/routes/capabilityEngine.ts"
      - "server/routes/capabilityPracticalEvidence.ts"
      - "server/routes/capabilityOralDefense.ts"
      - "client/src/pages/operational/tutor/capability-assessment.tsx"
      - "client/src/pages/operational/tutor/capability-practicals.tsx"
      - "client/src/pages/operational/capability-practical-review.tsx"
      - "client/src/pages/operational/capability-oral-defense-review.tsx"
      - "client/src/pages/operational/tutor/capabilityAssessmentBoundary.test.ts"
      - "client/src/pages/operational/tutor/capabilityPracticalsBoundary.test.ts"
      - "client/src/pages/operational/capabilityOralDefenseBoundary.test.ts"
      - "client/src/capabilityStandaloneApp.tsx"
      - "client/src/components/responseconditioning/DeepDiveDeterrent.tsx"
      - "client/src/main.tsx"
      - "migrations/2026-09-11_add_capability_assessment_attempts.sql"
      - "server/index.ts"
      - "api/index.ts"
      - ".github/workflows/capability-engine-ci.yml"

jobs:
  capability-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capability Engine tests
        run: npx tsx --test shared/capabilityEngine.test.ts shared/capabilityPracticalEvidence.test.ts shared/capabilityReadiness.test.ts shared/capabilityEvidenceSelection.test.ts shared/capabilityReviewerScope.test.ts shared/capabilityOralDefense.test.ts server/capabilityFormGeneration.test.ts server/capabilityPublicProjection.test.ts server/capabilityEngineBoundary.test.ts server/capabilityPracticalEvidenceBoundary.test.ts server/capabilityOralDefenseCore.test.ts server/capabilityOralDefenseBoundary.test.ts server/capabilityShadowJourney.test.ts server/capabilityRouteRegistration.test.ts client/src/pages/operational/tutor/capabilityAssessmentBoundary.test.ts client/src/pages/operational/tutor/capabilityPracticalsBoundary.test.ts client/src/pages/operational/capabilityOralDefenseBoundary.test.ts
      - name: TypeScript check
        run: npm run check
