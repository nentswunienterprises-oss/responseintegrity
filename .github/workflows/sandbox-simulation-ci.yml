name: Sandbox Simulation CI

on:
  pull_request:
    paths:
      - "shared/sandbox*.ts"
      - "shared/statefulSandbox*.ts"
      - "shared/trainingObservationContractV2.ts"
      - "shared/trainingObservationAuthorityV4.ts"
      - "shared/responseIntegrityDrillRegistry.ts"
      - "shared/trainingEvidenceEvaluator.ts"
      - "server/sandbox*.ts"
      - "server/routes/sandbox*.ts"
      - "server/routes/specialistDevelopment.ts"
      - "client/src/components/sandbox/*.tsx"
      - "client/src/pages/operational/tutor/sandbox*.tsx"
      - "client/src/components/tutor/TrainingLiveDeliveryUi.tsx"
      - "client/src/components/tutor/IntroSessionDrillRunner.tsx"
      - "migrations/*sandbox*.sql"
      - "server/index.ts"
      - "server/vercelPreviewApi.ts"
      - "client/src/App.tsx"
      - "client/src/lib/queryPersistence*.ts"
      - "scripts/sandboxQualificationNativePreparationAcceptance*.mjs"
      - "scripts/sandboxQualificationNativeFirstClarityRep*.mjs"
      - "package.json"
      - ".github/workflows/sandbox-simulation-ci.yml"
  push:
    branches:
      - "proof/sandbox-v1r1-reconciliation"
      - "fix/preview-training-session-authority"
    paths:
      - "shared/sandbox*.ts"
      - "shared/statefulSandbox*.ts"
      - "shared/trainingObservationContractV2.ts"
      - "shared/trainingObservationAuthorityV4.ts"
      - "shared/responseIntegrityDrillRegistry.ts"
      - "shared/trainingEvidenceEvaluator.ts"
      - "server/sandbox*.ts"
      - "server/routes/sandbox*.ts"
      - "server/routes/specialistDevelopment.ts"
      - "client/src/components/sandbox/*.tsx"
      - "client/src/pages/operational/tutor/sandbox*.tsx"
      - "client/src/components/tutor/TrainingLiveDeliveryUi.tsx"
      - "client/src/components/tutor/IntroSessionDrillRunner.tsx"
      - "migrations/*sandbox*.sql"
      - "server/index.ts"
      - "server/vercelPreviewApi.ts"
      - "client/src/App.tsx"
      - "client/src/lib/queryPersistence*.ts"
      - "scripts/sandboxQualificationNativePreparationAcceptance*.mjs"
      - "scripts/sandboxQualificationNativeFirstClarityRep*.mjs"
      - "package.json"
      - ".github/workflows/sandbox-simulation-ci.yml"

jobs:
  sandbox-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sandbox focused tests
        run: npm run test:sandbox
      - name: Native controlled Proof acceptance runner regressions (no credentials)
        run: node --test scripts/sandboxQualificationNativePreparationAcceptance.test.mjs
      - name: Native first Clarity rep protected manifest regressions (no credentials)
        run: node --test scripts/sandboxQualificationNativeFirstClarityRep.test.mjs
      - name: Frontend live-runner bundle
        run: npx vite build
      - name: Preview API bundle
        run: npm run build:vercel-api
