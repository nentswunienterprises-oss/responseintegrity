name: Sandbox V2 Authenticated Proof Smoke

on:
  push:
    branches:
      - fix/preview-training-session-authority
    paths:
      - '.github/workflows/sandbox-v2-authenticated-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-v2-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROOF_BASE_URL: https://tt-confidence-pclvfyd7k-relief-works-technologies.vercel.app
      PROOF_EXPECTED_SHA: fc8b8633bf6b23f3b3b89ed00d89c1eafdb8408f
      PROOF_ASSIGNMENT_ID: 836a839f-2f29-45c7-b8c2-aa501c95e1b0
      PROOF_STUDENT_ID: e1c11823-05e7-47a1-a753-e6599954df1a
      PROOF_BOOKING_ID: 05da6194-db28-41ea-8798-e17c0ab9aa4d
      PROOF_TOPIC: Fractions
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install authenticated browser client
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run bounded, real authenticated V2 Sandbox preview smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const base = process.env.PROOF_BASE_URL.replace(/\/$/, '');
          const expected = process.env.PROOF_EXPECTED_SHA;
          const assignment = process.env.PROOF_ASSIGNMENT_ID;
          const student = process.env.PROOF_STUDENT_ID;
          const session = process.env.PROOF_BOOKING_ID;
          const topic = process.env.PROOF_TOPIC;
          const email = String(process.env.RI_PROOF_EMAIL || '').trim();
          const password = String(process.env.RI_PROOF_PASSWORD || '');
          const bypass = String(process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '').trim();
          assert.ok(email && password, 'Repository Proof Specialist test credentials are required');

          const browser = await chromium.launch({headless: true});
          try {
            const context = await browser.newContext({
              viewport: {width: 1440, height: 980},
              ...(bypass ? {extraHTTPHeaders: {'x-vercel-protection-bypass': bypass}} : {}),
            });
            const page = await context.newPage();
            const getJson = async (path) => {
              const response = await page.request.get(base + path, {timeout: 60000});
              assert.ok(response.ok(), 'GET '+path+' returned HTTP '+response.status());
              return response.json();
            };

            // Strict preflight BEFORE logging in or initializing a trajectory.
            const proof = await getJson('/api/proof-environment');
            assert.equal(proof.vercelEnv, 'preview', 'Must never target Production');
            assert.equal(proof.supabaseProjectRef, 'jftlxeacphvbnhbsbpxc', 'Must use Capability Proof');
            assert.equal(proof.commitSha, expected, 'Stale or mismatched preview rejected');
            console.log('V2_PREVIEW_PROVENANCE=PASS');

            const signin = await page.request.post(base + '/api/auth/signin', {
              data: {email, password, expectedRole: 'tutor'}, timeout: 60000,
            });
            assert.ok(signin.ok(), 'Controlled Proof Specialist sign-in failed: HTTP '+signin.status());
            const auth = await signin.json();
            assert.equal(String(auth?.dbUser?.role || '').toLowerCase(), 'tutor');
            const runtime = await getJson('/api/tutor/runtime-mode');
            assert.equal(runtime.operationalMode, 'sandbox', 'Account is not in Sandbox');
            assert.equal(String(runtime.assignmentId), assignment);
            console.log('V2_PROOF_AUTHORITY=PASS');

            const params = new URLSearchParams({
              tutorAssignmentId: assignment,
              studentId: student,
              scheduledSessionId: session,
              topic,
              sessionNumber: '1',
            });
            // Real GET creates the V2 trajectory through normal server authority.
            const form = await getJson('/api/tutor/sandbox-environment?' + params);
            assert.equal(form.evidenceScope, 'sandbox');
            assert.equal(form.studentStateAuthoritative, false);
            assert.equal(form.status, 'rep_ready', 'The fixture must be a real launch-ready lesson');
            assert.ok(form.trajectoryId && form.eventFormId && form.rep?.studentBehavior);
            assert.ok(Array.isArray(form.rep.fields) && form.rep.fields.length);
            assert.ok(!JSON.stringify(form).includes('"canonicalObservations"'), 'Canonical answers must stay private');
            assert.ok(!JSON.stringify(form).includes('"trajectory_seed"'), 'Private student seed leaked');

            const reload = await getJson('/api/tutor/sandbox-environment?' + params);
            assert.equal(reload.eventFormId, form.eventFormId, 'Reload selected a different outcome');
            assert.equal(reload.rep.studentBehavior, form.rep.studentBehavior, 'Reload changed student conduct');
            assert.equal(reload.trajectoryId, form.trajectoryId);
            console.log('V2_AUTHENTICATED_FORM_REPLAY=PASS ' + JSON.stringify({
              session: form.sessionNumber, phase: form.prescribedPhase,
              set: form.rep.setId, rep: form.rep.repNumber,
              observations: form.rep.fields.length,
            }));

            const url = base + '/operational/specialist/sandbox?' + new URLSearchParams({
              studentId: student, scheduledSessionId: session, topic, sandboxSession: '1',
            });
            await page.goto(url, {waitUntil: 'domcontentloaded', timeout: 90000});
            await page.getByText(form.rep.studentBehavior, {exact: false}).first()
              .waitFor({state: 'visible', timeout: 45000});
            console.log('V2_AUTHENTICATED_STUDENT_BEHAVIOR_RENDERED=PASS');
            // No rep is submitted: historical session evidence and package consumption stay untouched.
            console.log('V2_BOUNDED_PROOF_SMOKE=PASS');
          } finally {
            await browser.close();
          }
          NODE
