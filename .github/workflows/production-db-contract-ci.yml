name: Production DB Contract CI

on:
  pull_request:
    paths:
      - "migrations/**"
      - "config/production-migration-authority.json"
      - "scripts/productionMigrationAuthority.ts"
      - "scripts/productionMigrationAuthority.test.ts"
      - ".github/workflows/production-db-contract-ci.yml"
      - ".github/workflows/production-db-promotion.yml"
      - "docs/production-database-promotion.md"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - "config/production-migration-authority.json"
      - "scripts/productionMigrationAuthority.ts"
      - "scripts/productionMigrationAuthority.test.ts"
      - ".github/workflows/production-db-contract-ci.yml"
      - ".github/workflows/production-db-promotion.yml"
      - "docs/production-database-promotion.md"
      - "package.json"
      - "package-lock.json"

jobs:
  production-db-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:db-authority
      - run: npm run db:authority:verify
