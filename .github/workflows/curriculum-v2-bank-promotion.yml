name: Curriculum v2 Bank Promotion

on:
  push:
    branches:
      - release/curriculum-v2-activation
    paths:
      - ".github/workflows/curriculum-v2-bank-promotion.yml"
      - "scripts/promoteCurriculumV2Banks.mjs"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 20
    env:
      RI_PROOF_DATABASE_URL: ${{ secrets.RI_PROOF_DATABASE_URL }}
      RI_PRODUCTION_DATABASE_URL: ${{ secrets.RI_PRODUCTION_DATABASE_URL }}
      CURRICULUM_V2_PROMOTION_MODE: plan
      CURRICULUM_V2_PROMOTION_CONFIRM: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Plan Curriculum v2 private-bank promotion
        run: node scripts/promoteCurriculumV2Banks.mjs
