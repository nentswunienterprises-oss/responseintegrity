name: Curriculum v2 Bank Promotion

on:
  push:
    branches:
      - release/curriculum-v2-activation
    paths:
      - ".github/workflows/curriculum-v2-bank-promotion.yml"
      - "scripts/promoteCurriculumV2Banks.mjs"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 20
    env:
      RI_PROOF_DATABASE_URL: ${{ secrets.RI_PROOF_DATABASE_URL }}
      RI_PRODUCTION_DATABASE_URL: ${{ secrets.RI_PRODUCTION_DATABASE_URL }}
      CURRICULUM_V2_PROMOTION_MODE: stage
      CURRICULUM_V2_PROMOTION_CONFIRM: THE_HUB_STAGE_V2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure verified Supabase CA trust
        env:
          RI_PRODUCTION_DB_CA_CERT: ${{ secrets.RI_PRODUCTION_DB_CA_CERT }}
        run: |
          test -n "$RI_PRODUCTION_DB_CA_CERT"
          CA_PATH="$RUNNER_TEMP/supabase-release-ca.crt"
          printf '%s\n' "$RI_PRODUCTION_DB_CA_CERT" > "$CA_PATH"
          chmod 600 "$CA_PATH"
          echo "NODE_EXTRA_CA_CERTS=$CA_PATH" >> "$GITHUB_ENV"
      - name: Stage approved Curriculum v2 private banks
        run: node scripts/promoteCurriculumV2Banks.mjs
