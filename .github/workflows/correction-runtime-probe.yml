name: Correction Runtime Probe
on:
  push:
    branches: [proof/capability-engine-shadow-validation]
    paths: [.github/workflows/correction-runtime-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/capability-engine-shadow-validation
          fetch-depth: 0
      - name: Capture integration points
        run: |
          {
            echo '=== routes report functions ==='
            grep -n -C 12 -E 'maybeAutoSendDeterministicReports|createWeeklyStructuredDataFromDrills|insertWeeklyReport|insertMonthlyReport' server/routes.ts || true
            echo '=== training route ==='
            grep -n -C 35 -E 'training-session-drill' server/routes.ts || true
            echo '=== updateStudent impl ==='
            grep -n -C 20 -E 'async updateStudent\(' server/storage.ts || true
            echo '=== tutor assignment impl ==='
            grep -n -C 20 -E 'async getTutorAssignment\(' server/storage.ts || true
            echo '=== timer contract supersession ==='
            grep -n -C 20 -E 'supersedes_contract_id|insertTimerContract|persist.*Contract|capability_tps_timer_contracts' server/routes/capabilityTpsTimerRuntime.ts || true
            echo '=== report schema references ==='
            grep -R -n -C 10 -E 'parent_reports' server shared | head -n 500 || true
          } > docs/_correction_runtime_probe.txt
          git config user.name 'nentswunienterprises-oss'
          git config user.email 'nentswunienterprises@gmail.com'
          git add docs/_correction_runtime_probe.txt
          git commit -m 'Capture correction runtime integration points'
          git push origin HEAD:proof/capability-engine-shadow-validation
