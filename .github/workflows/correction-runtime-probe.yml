name: Correction Runtime Probe
on:
  push:
    branches: [proof/capability-engine-shadow-validation]
    paths: [.github/workflows/correction-runtime-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/capability-engine-shadow-validation
          fetch-depth: 0
      - name: Capture integration points
        run: |
          {
            echo '=== routes tail ==='
            tail -n 180 server/routes.ts
            echo '=== parent report map route ==='
            grep -n -C 45 -E 'mapParentFacingReport|api/parent/reports' server/routes.ts | tail -n 500
          } > docs/_correction_runtime_probe3.txt
          git config user.name 'nentswunienterprises-oss'
          git config user.email 'nentswunienterprises@gmail.com'
          git add docs/_correction_runtime_probe3.txt
          git commit -m 'Probe correction route registration tail'
          git push origin HEAD:proof/capability-engine-shadow-validation
