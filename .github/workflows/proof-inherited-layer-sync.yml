name: Proof Inherited Layer Doctrine Sync

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-inherited-layer-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/capability-engine-shadow-validation
          fetch-depth: 0

      - name: Make inherited layers explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          canonical = Path("docs/response-integrity-os-implementation-source-of-truth.md")
          canonical_anchor = """The intended forward sequence is:\n\n- `Clarity` -> `Structured Execution` -> `Controlled Discomfort` -> `Time Pressure Stability`\n\nThere is no cross-phase regression engine currently implemented inside the core transition function."""
          canonical_insert = """The intended forward sequence is:\n\n- `Clarity` -> `Structured Execution` -> `Controlled Discomfort` -> `Time Pressure Stability`\n\n### Layer inheritance rule\n\nProgression adds a condition. It does not discard the capability built before it.\n\n- `Clarity` establishes the usable mental map: Vocabulary, Method, and Reason, with the required step sequence available to the student.\n- `Structured Execution` inherits that mental map and adds independent, ordered, repeatable execution.\n- `Controlled Discomfort` inherits Clarity and Structured Execution and adds meaningful difficulty and uncertainty.\n- `Time Pressure Stability` inherits all earlier layers and adds urgency through the timer condition.\n\nWhen an error appears, locate the earliest layer that visibly broke. A wrong final answer alone does not identify the broken layer. An isolated local calculation error can change the final answer without proving that Vocabulary, Method, Reason, the method chain, independence, or the current-phase response broke. The reverse also matters: calmness, persistence, speed, or a correct final answer cannot be used to excuse a visibly broken earlier layer.\n\nThis inheritance rule does not give the Specialist authority to move a topic backward or forward manually. The Specialist records what actually happened, including any visible upstream-layer break; the deterministic state engine still owns movement.\n\nThere is no cross-phase regression engine currently implemented inside the core transition function."""
          replace_once(canonical, canonical_anchor, canonical_insert, "canonical layer-inheritance rule")

          exact = Path("TT_DRILL_LIBRARY_AND_STATE_ENGINE_EXACT.md")
          exact_anchor = """### Time Pressure Stability\n\n- Purpose: `Maintain method structure under urgency. Structure is the target - speed is secondary.`\n- Constraints:\n  - `Method over speed`\n  - `Timer is active`\n  - `Structured response required - panic responding is logged as instability.`\n\n## Drill library"""
          exact_insert = """### Time Pressure Stability\n\n- Purpose: `Maintain method structure under urgency. Structure is the target - speed is secondary.`\n- Constraints:\n  - `Method over speed`\n  - `Timer is active`\n  - `Structured response required - panic responding is logged as instability.`\n\n## Layer inheritance rule\n\nProgression adds a condition; it does not discard earlier capability.\n\n- `Clarity` establishes Vocabulary, Method, and Reason, with the required step sequence available to the student.\n- `Structured Execution` inherits Clarity and adds independent, ordered, repeatable execution.\n- `Controlled Discomfort` inherits Clarity plus Structured Execution and adds difficulty and uncertainty.\n- `Time Pressure Stability` inherits all earlier layers and adds urgency.\n\nWhen an error appears, locate the earliest layer that visibly broke. A wrong final answer alone does not identify that layer. An isolated calculation error may change the answer without proving that the mental map, method chain, independence, or current-phase response broke. Conversely, strong behavior in a later phase cannot excuse a visible break in an earlier layer.\n\nThis does not create manual cross-phase movement. The Specialist records the evidence; the state engine owns movement.\n\n## Drill library"""
          replace_once(exact, exact_anchor, exact_insert, "TT layer-inheritance rule")

          structured = Path("client/src/pages/responseconditioningsystem/transformation-phases/structured-execution.tsx")
          structured_anchor = """          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>No Boss Battles.</li>\n            <li>No timed pressure.</li>\n            <li>No rescuing the student into a stronger-looking score.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-5 border-primary/30 bg-primary/5\">"""
          structured_insert = """          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>No Boss Battles.</li>\n            <li>No timed pressure.</li>\n            <li>No rescuing the student into a stronger-looking score.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-4\">\n          <h2 className=\"text-2xl font-bold\">What This Phase Inherits</h2>\n          <p className=\"text-muted-foreground\">\n            Progression adds a condition; it does not discard Clarity. Structured Execution inherits the student's Vocabulary, Method,\n            and Reason mental map and adds independent, ordered, repeatable execution.\n          </p>\n          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>If Vocabulary, Method, or Reason visibly breaks, record that break instead of letting a correct answer hide it.</li>\n            <li>An isolated calculation error does not automatically mean the mental map broke; locate where the error actually occurred.</li>\n            <li>The Specialist records the evidence. RI-OS still owns topic-state movement.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-5 border-primary/30 bg-primary/5\">"""
          replace_once(structured, structured_anchor, structured_insert, "Structured Execution inherited-layer card")

          controlled = Path("client/src/pages/responseconditioningsystem/transformation-phases/controlled-discomfort.tsx")
          controlled_anchor = """          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>Difficulty is present.</li>\n            <li>Full rescue is not allowed.</li>\n            <li>Timers are not the main pressure yet.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-5 border-primary/30 bg-primary/5\">"""
          controlled_insert = """          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>Difficulty is present.</li>\n            <li>Full rescue is not allowed.</li>\n            <li>Timers are not the main pressure yet.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-4\">\n          <h2 className=\"text-2xl font-bold\">What This Phase Inherits</h2>\n          <p className=\"text-muted-foreground\">\n            Controlled Discomfort does not replace Clarity or Structured Execution. It asks whether that existing mental map and\n            independent method execution stay intact after meaningful difficulty is added.\n          </p>\n          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>Calmness or persistence cannot turn a wrong method, abandoned structure, or random execution into strong evidence.</li>\n            <li>When something goes wrong, locate the earliest visible break: mental map, execution, or response under difficulty.</li>\n            <li>A local calculation error can change the final answer without proving an inherited layer collapsed.</li>\n            <li>Record the actual break without manually changing the student's phase; RI-OS owns movement.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-5 border-primary/30 bg-primary/5\">"""
          replace_once(controlled, controlled_anchor, controlled_insert, "Controlled Discomfort inherited-layer card")

          timed = Path("client/src/pages/responseconditioningsystem/transformation-phases/time-pressure-stability.tsx")
          timed_anchor = """          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>Timer pressure is present.</li>\n            <li>Specialist help is withheld.</li>\n            <li>Method integrity remains more important than raw speed.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-5 border-primary/30 bg-primary/5\">"""
          timed_insert = """          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>Timer pressure is present.</li>\n            <li>Specialist help is withheld.</li>\n            <li>Method integrity remains more important than raw speed.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-4\">\n          <h2 className=\"text-2xl font-bold\">What This Phase Inherits</h2>\n          <p className=\"text-muted-foreground\">\n            Time Pressure Stability inherits the mental map, independent execution, and response under difficulty already built in the\n            earlier phases. The timer adds urgency; it does not replace those requirements.\n          </p>\n          <ul className=\"space-y-2 text-sm text-muted-foreground\">\n            <li>A fast or correct final answer does not excuse lost method structure, random execution, or renewed rescue dependence.</li>\n            <li>If urgency exposes an earlier-layer break, record the layer that actually broke instead of calling every failure a time problem.</li>\n            <li>An isolated calculation error does not automatically prove the inherited layers failed.</li>\n            <li>The Specialist records the evidence. RI-OS still owns topic-state movement.</li>\n          </ul>\n        </Card>\n\n        <Card className=\"p-6 space-y-5 border-primary/30 bg-primary/5\">"""
          replace_once(timed, timed_anchor, timed_insert, "Time Pressure Stability inherited-layer card")
          PY

      - name: Verify and commit inherited-layer doctrine
        shell: bash
        run: |
          git diff --check
          git diff -- docs/response-integrity-os-implementation-source-of-truth.md TT_DRILL_LIBRARY_AND_STATE_ENGINE_EXACT.md client/src/pages/responseconditioningsystem/transformation-phases/structured-execution.tsx client/src/pages/responseconditioningsystem/transformation-phases/controlled-discomfort.tsx client/src/pages/responseconditioningsystem/transformation-phases/time-pressure-stability.tsx
          test -n "$(git status --porcelain -- docs/response-integrity-os-implementation-source-of-truth.md TT_DRILL_LIBRARY_AND_STATE_ENGINE_EXACT.md client/src/pages/responseconditioningsystem/transformation-phases/structured-execution.tsx client/src/pages/responseconditioningsystem/transformation-phases/controlled-discomfort.tsx client/src/pages/responseconditioningsystem/transformation-phases/time-pressure-stability.tsx)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/response-integrity-os-implementation-source-of-truth.md TT_DRILL_LIBRARY_AND_STATE_ENGINE_EXACT.md client/src/pages/responseconditioningsystem/transformation-phases/structured-execution.tsx client/src/pages/responseconditioningsystem/transformation-phases/controlled-discomfort.tsx client/src/pages/responseconditioningsystem/transformation-phases/time-pressure-stability.tsx
          git commit -m "Make inherited phase layers explicit"
          git push origin HEAD:proof/capability-engine-shadow-validation
