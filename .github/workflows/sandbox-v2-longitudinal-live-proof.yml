name: Sandbox V2 Longitudinal Live Proof

on:
  push:
    branches:
      - fix/preview-training-session-authority
    paths:
      - 'scripts/sandboxV2LongitudinalLiveProof.mjs'
      - '.github/workflows/sandbox-v2-longitudinal-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-v2-longitudinal-proof
  cancel-in-progress: false

jobs:
  longitudinal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install request-only client (no browser or Chromium required)
        run: npm install --no-save playwright@1.55.0
      - name: Exercise actual Sandbox V2 sessions and Topic A-B-A
        run: node scripts/sandboxV2LongitudinalLiveProof.mjs
