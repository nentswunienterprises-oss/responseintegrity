name: Proof Route Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate training runtime
        run: |
          echo '=== training-session-drill ==='
          grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'training-session-drill' . || true
          echo '=== computeTransition server references ==='
          grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'computeTransition' server api | head -80 || true
          echo '=== conceptMastery training references ==='
          grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'conceptMastery' server api | head -120 || true
