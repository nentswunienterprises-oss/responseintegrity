name: Proof Runtime Seam Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect evidence correction runtime seams
        run: |
          echo '=== correction route and authority anchors ==='
          grep -n -i -B12 -A45 -E 'evidence[-_ ]correction|response_integrity_evidence_corrections|supersession_event_id|replay_status|approved_by|reviewed_by' server/routes.ts || true
          echo '=== correction module references ==='
          grep -R -n -i -E 'applyEvidenceCorrectionOverlays|EvidenceCorrectionOverlay|responseIntegrityEvidenceCorrection' server shared client/src | head -240 || true
          echo '=== submitted evidence mutation/delete anchors ==='
          grep -n -i -B10 -A25 -E 'intro_session_drills.*(update|delete)|from\("intro_session_drills"\).*\.(update|delete)|DELETE FROM public\.intro_session_drills|UPDATE public\.intro_session_drills' server/routes.ts || true
      - name: Inspect inherited verification runtime seams
        run: |
          echo '=== inherited verification server anchors ==='
          grep -n -B20 -A80 -E 'resolveInheritedVerification|inheritedVerificationHold|freshCurrentPhaseEvidenceRequired|inherited_verification_required|targeted_re_diagnosis_required' server/routes.ts || true
          echo '=== inherited verification runner anchors ==='
          grep -n -B20 -A70 -E 'inherited-verification|isInheritedVerification|rediagnosis|freshCurrentPhaseEvidenceRequired' client/src/components/tutor/IntroSessionDrillRunner.tsx client/src/components/tutor/StudentTopicConditioningDialog.tsx || true
