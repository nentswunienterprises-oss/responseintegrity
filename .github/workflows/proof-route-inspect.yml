name: Proof Route Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect training transition implementation
        run: |
          echo '=== imports 1-90 ==='
          sed -n '1,90p' server/routes.ts
          echo '=== training route 6980-7360 ==='
          sed -n '6980,7360p' server/routes.ts
          echo '=== summary transition helper 12120-12230 ==='
          sed -n '12120,12230p' server/routes.ts
