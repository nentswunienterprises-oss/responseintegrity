name: Proof Inherited Verification Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect inherited verification insertion anchors
        run: |
          echo '=== imports and helper references ==='
          grep -n -B8 -A20 'inheritedLayerVerification' server/routes.ts | head -80
          grep -n -B15 -A35 'resolveTutorScheduledSession' server/routes.ts | head -180
          echo '=== handover endpoint through training route opening ==='
          sed -n '6720,7115p' server/routes.ts
          echo '=== training route core and persistence ==='
          sed -n '7115,7525p' server/routes.ts
          echo '=== training route tail ==='
          sed -n '7525,7665p' server/routes.ts
