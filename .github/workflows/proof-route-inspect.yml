name: Proof Correction Replay Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect scoring and replay seams
        run: |
          echo '=== scoring helpers 3970-4525 ==='
          sed -n '3970,4525p' server/routes.ts
          echo '=== ledger projection parser 1-430 ==='
          sed -n '1,430p' server/responseIntegrityEvidenceLedger.ts
          echo '=== route report builders 5600-6190 ==='
          sed -n '5600,6190p' server/routes.ts
          echo '=== current TD scoped endpoints 15980-16640 ==='
          sed -n '15980,16640p' server/routes.ts
          echo '=== pod/access utility around 17000 ==='
          sed -n '16980,17170p' server/routes.ts
