name: Proof Route Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect training persistence anchors
        run: |
          echo '=== route imports around topic conditioning engine ==='
          grep -n -B8 -A18 'topicConditioningEngine' server/routes.ts | head -80
          echo '=== computeTrainingSessionSummary full helper ==='
          sed -n '4355,4505p' server/routes.ts
          echo '=== training route start through summary ==='
          sed -n '6995,7285p' server/routes.ts
          echo '=== training persistence continuation ==='
          sed -n '7285,7585p' server/routes.ts
          echo '=== runner submit payload + result handling ==='
          sed -n '1870,2105p' client/src/components/tutor/IntroSessionDrillRunner.tsx
