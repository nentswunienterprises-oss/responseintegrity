name: Proof Inherited Verification Stage 2 Retry

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/capability-engine-shadow-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply inherited verification stage two
        run: |
          python scripts/proof-inherited-verification-stage2.py
          python scripts/proof-inherited-verification-stage2-fix.py
      - name: Run focused doctrine and lineage tests
        run: node --import tsx --test shared/responseIntegrityEvidenceContractV2.test.ts shared/inheritedLayerVerification.test.ts shared/responseSnapshot.test.ts server/responseIntegrityEvidenceLedger.test.ts
      - name: Build backend
        run: npm run build:backend
      - name: Build frontend
        run: npm run build:frontend
      - name: Commit proof implementation
        run: |
          git config user.name "nentswunienterprises-oss"
          git config user.email "nentswunienterprises@gmail.com"
          git add server/routes.ts server/responseIntegrityEvidenceLedger.ts server/responseIntegrityEvidenceLedger.test.ts shared/responseSnapshot.ts shared/responseSnapshot.test.ts client/src/components/tutor/IntroSessionDrillRunner.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Implement inherited-layer verification flow"
          git push origin HEAD:proof/capability-engine-shadow-validation
