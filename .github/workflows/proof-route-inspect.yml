name: Proof Evidence Correction Core

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run evidence correction core tests
        run: node --import tsx --test shared/responseIntegrityEvidenceCorrection.test.ts shared/responseIntegrityEvidenceContractV2.test.ts shared/responseIntegrityDrillRegistry.test.ts
      - name: Build backend
        run: npm run build:backend
