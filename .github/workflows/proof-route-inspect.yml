name: Proof Route Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect inherited verification route boundaries
        run: |
          echo '=== training summary helper 4380-4525 ==='
          sed -n '4380,4525p' server/routes.ts
          echo '=== handover/verification 6400-7005 ==='
          sed -n '6400,7005p' server/routes.ts
          echo '=== handover summary helpers grep ==='
          grep -n -E 'computeHandover|handoverSummary|verificationOutcome|handover verification|reDiagnosisRequired' server/routes.ts | head -120
          echo '=== handover launch/client grep ==='
          grep -R -n --exclude-dir=node_modules --exclude-dir=.git -E 'mode=handover|rediagnosis=1|handover.*drill|verification' client/src | head -160
