name: Proof Correction Runtime Design Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect TD assignment authority anchors
        run: |
          echo '=== tutor to TD assignment tables and helpers ==='
          grep -R -n -i -B8 -A22 -E 'td[_ -]?tutor|tutor[_ -]?td|assigned[_ -]?td|td_id|territory director.*tutor|tutor.*territory director' server shared | head -520 || true
          echo '=== role extraction and role names ==='
          grep -n -B10 -A25 -E 'requireRole\(\["(td|coo)|dbUser\.role|session.*role' server/routes.ts | head -360 || true
      - name: Inspect evidence lineage and replay inputs
        run: |
          echo '=== intro drill chronological read anchors ==='
          grep -n -B15 -A45 -E 'from\("intro_session_drills"\)|FROM public\.intro_session_drills' server/routes.ts server/responseIntegrityEvidenceLedger.ts | head -640 || true
          echo '=== training summary/scoring helpers ==='
          grep -n -B15 -A120 -E 'const computeTrainingSessionSummary|INTRO_PHASE_WEIGHTS|resolveObservationValue|observationLevelFor' server/routes.ts | head -620 || true
          echo '=== deterministic report generation anchors ==='
          grep -n -B15 -A70 -E 'maybeAutoSendDeterministicReports|buildResponseSnapshotV1|reports-center|parent_reports' server/routes.ts | head -620 || true
      - name: Inspect V2 support consumption
        run: |
          echo '=== operational evidence decoder use outside shared core ==='
          grep -R -n -B8 -A30 -E 'decodeRepOperationalEvidenceV2|actualSupportUsed|REP_OPERATIONAL_EVIDENCE_V2_WIRE_KEY' server shared | head -620 || true
