name: Proof Correction Target Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect support validity and correction seams
        run: |
          echo '=== operational evidence codec usage ==='
          grep -R -n --exclude-dir=node_modules --exclude-dir=.git -E 'REP_OPERATIONAL_EVIDENCE_V2_WIRE_KEY|decodeRepOperationalEvidenceV2|actualSupportUsed|supportLevel' server shared client/src/components/tutor/IntroSessionDrillRunner.tsx | head -420
          echo '=== semantic evidence validator ==='
          grep -n -B80 -A220 'validateAndNormalizeSemanticEvidenceSet' server/routes.ts | head -420
          echo '=== registry option identity helpers ==='
          grep -n -B50 -A140 'getEvidenceSelectionIdentity' shared/responseIntegrityDrillRegistry.ts | head -260
          echo '=== source drill immutability / migrations ==='
          grep -R -n --include='*.sql' -E 'intro_session_drills|prevent.*drill|immutable|BEFORE UPDATE|BEFORE DELETE' migrations supabase 2>/dev/null | head -360 || true
          echo '=== parent report uniqueness / supersession seams ==='
          grep -R -n --include='*.sql' -E 'parent_reports|report_window_key|UNIQUE|supersed' migrations supabase 2>/dev/null | head -420 || true
