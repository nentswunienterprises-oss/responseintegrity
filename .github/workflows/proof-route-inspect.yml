name: Proof Route Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect inherited verification helpers and topic UI
        run: |
          echo '=== handover summary helpers 4235-4375 ==='
          sed -n '4235,4375p' server/routes.ts
          echo '=== topic conditioning GET routes ==='
          grep -n -E 'api/tutor/topic-conditioning|topic-conditioning/:studentId' server/routes.ts | head -40
          echo '=== StudentTopicConditioningDialog topic definitions ==='
          sed -n '1,360p' client/src/components/tutor/StudentTopicConditioningDialog.tsx
          echo '=== StudentCard relevant topic dialog lines ==='
          grep -n -E 'StudentTopicConditioningDialog|topicConditioning|Training|Run.*drill' client/src/components/tutor/StudentCard.tsx | head -140
