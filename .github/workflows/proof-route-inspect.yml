name: Proof Route Inspect

on:
  push:
    branches:
      - proof/capability-engine-shadow-validation
    paths:
      - .github/workflows/proof-route-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect inherited verification launch anchors
        run: |
          echo '=== training launch function context ==='
          grep -n -B35 -A55 'mode=training&topic' client/src/components/tutor/StudentTopicConditioningDialog.tsx
          echo '=== topic row construction persisted state context ==='
          grep -n -B25 -A90 'persistedEntries.forEach' client/src/components/tutor/StudentTopicConditioningDialog.tsx
          echo '=== topic-conditioning GET ==='
          sed -n '27830,27935p' server/routes.ts
