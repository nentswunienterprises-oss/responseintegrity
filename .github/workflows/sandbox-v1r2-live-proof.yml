name: Sandbox V1R2 Content Graduation Live Proof

on:
  push:
    branches:
      - proof/sandbox-v1r2-content-graduation
    paths:
      - '.github/workflows/sandbox-v1r2-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  sandbox-v1r2-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_BASE_URL: https://tt-confidence-a8m72q55g-relief-works-technologies.vercel.app
      PROOF_EXPECTED_APP_SHA: 932ca7f82320c1ba54dae4abe89865e2f72176e8
      RI_PROOF_EMAIL: ${{ secrets.RI_PROOF_SPECIALIST_EMAIL }}
      RI_PROOF_PASSWORD: ${{ secrets.RI_PROOF_SPECIALIST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RI_PROOF_ASSIGNMENT_ID: 836a839f-2f29-45c7-b8c2-aa501c95e1b0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run authenticated V1R2 journey
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const baseUrl = String(process.env.SMOKE_BASE_URL || "").replace(/\/$/, "");
          const shareUrl = String(process.env.VERCEL_SHARE_URL || "").trim();
          const email = String(process.env.RI_PROOF_EMAIL || "").trim();
          const password = String(process.env.RI_PROOF_PASSWORD || "");
          const tutorAssignmentId = String(process.env.RI_PROOF_ASSIGNMENT_ID || "").trim();
          const expectedCommit = String(process.env.PROOF_EXPECTED_APP_SHA || "").trim();
          const bypass = String(process.env.VERCEL_AUTOMATION_BYPASS_SECRET || "").trim();
          assert.ok(baseUrl && shareUrl && email && password && tutorAssignmentId && expectedCommit);

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1100 },
            ...(bypass ? { extraHTTPHeaders: { "x-vercel-protection-bypass": bypass } } : {}),
          });
          const page = await context.newPage();
          const pageErrors = [];
          page.on("pageerror", (error) => pageErrors.push(String(error?.stack || error)));

          await page.goto(shareUrl, { waitUntil: "domcontentloaded", timeout: 90000 });
          const proof = await page.request.get(baseUrl + "/api/proof-environment", { timeout: 60000 });
          const proofText = await proof.text();
          assert.ok(proof.ok(), "Proof environment failed: " + proof.status() + " " + proofText);
          const proofBody = JSON.parse(proofText);
          assert.equal(proofBody.vercelEnv, "preview");
          assert.equal(proofBody.supabaseProjectRef, "jftlxeacphvbnhbsbpxc");
          assert.equal(proofBody.commitSha, expectedCommit);

          const signin = await page.request.post(baseUrl + "/api/auth/signin", {
            data: { email, password, expectedRole: "tutor" },
            timeout: 60000,
          });
          const signinText = await signin.text();
          assert.ok(signin.ok(), "Login failed: " + signin.status() + " " + signinText);
          const signinBody = JSON.parse(signinText);
          assert.equal(String(signinBody?.dbUser?.role || "").toLowerCase(), "tutor");

          async function getGraduation() {
            const response = await page.request.get(
              baseUrl + "/api/tutor/sandbox-simulation/graduation?tutorAssignmentId=" +
                encodeURIComponent(tutorAssignmentId),
              { timeout: 60000 },
            );
            const text = await response.text();
            assert.ok(response.ok(), "Graduation status failed: " + response.status() + " " + text);
            return JSON.parse(text);
          }

          const before = await getGraduation();
          assert.equal(before.bankVersion, 3);
          assert.equal(before.policyAvailable, true);
          assert.equal(before.policyStatus, "candidate");
          assert.equal(before.minimumObservationFidelityPercent, 90);
          assert.equal(before.requireSystemOutcomeMatch, true);
          assert.equal(before.requiredDistinctScenarios, 8);
          assert.equal(before.phases.length, 4);
          assert.equal(before.phases.every((phase) => phase.requiredDistinctScenarios === 2), true);
          assert.equal(before.evidenceReady, false);
          assert.equal(before.practicalsReady, false);
          assert.equal(before.automaticTransition, false);
          assert.equal(before.nextStage, "practicals");

          async function loadForm() {
            const response = await page.request.get(
              baseUrl + "/api/tutor/sandbox-simulation?tutorAssignmentId=" +
                encodeURIComponent(tutorAssignmentId),
              { timeout: 60000 },
            );
            const text = await response.text();
            assert.ok(response.ok(), "Sandbox form failed: " + response.status() + " " + text);
            const body = JSON.parse(text);
            assert.equal(body.bankKey, "sandbox_observation_foundation");
            assert.equal(body.bankVersion, 3);
            assert.equal(body.maxAttempts, 12);
            assert.ok([
              "Clarity",
              "Structured Execution",
              "Controlled Discomfort",
              "Time Pressure Stability",
            ].includes(body.scenario.phase));
            const serialized = JSON.stringify(body);
            assert.equal(/"canonicalOutcome"\s*:/.test(serialized), false);
            assert.equal(/"observations"\s*:/.test(serialized), false);
            return body;
          }

          const first = await loadForm();
          const firstAttemptNumber = first.attemptNumber;
          assert.ok(firstAttemptNumber >= 1 && firstAttemptNumber < first.maxAttempts);
          const repeated = await loadForm();
          assert.equal(repeated.scenarioFormId, first.scenarioFormId);
          assert.equal(repeated.scenario.key, first.scenario.key);

          const submission = {
            sets: first.scenario.sets.map((set) => ({
              setId: set.setId,
              reps: set.reps.map((rep) => ({
                repNumber: rep.repNumber,
                observations: Object.fromEntries(
                  rep.fields.map((field) => [
                    field.fieldKey,
                    { optionId: field.options[0].optionId, evidenceStatus: "observed" },
                  ]),
                ),
              })),
            })),
          };

          const submit = await page.request.post(
            baseUrl + "/api/tutor/sandbox-simulation/attempt",
            {
              data: {
                tutorAssignmentId,
                bankVersion: first.bankVersion,
                scenarioFormId: first.scenarioFormId,
                submission,
              },
              timeout: 60000,
            },
          );
          const submitText = await submit.text();
          assert.ok(submit.ok(), "Sandbox submit failed: " + submit.status() + " " + submitText);
          const result = JSON.parse(submitText);
          assert.ok(result.attemptId);
          assert.equal(result.bankVersion, 3);
          assert.equal(result.attemptNumber, firstAttemptNumber);
          assert.equal(result.studentStateAuthoritative, false);
          assert.equal(result.evidenceScope, "sandbox");

          const after = await getGraduation();
          assert.equal(after.bankVersion, 3);
          assert.equal(after.policyStatus, "candidate");
          assert.equal(after.practicalsReady, false);
          assert.equal(after.automaticTransition, false);
          assert.equal(after.requiredDistinctScenarios, 8);
          assert.ok(after.qualifyingDistinctScenarios <= 1);

          const second = await loadForm();
          assert.equal(second.attemptNumber, firstAttemptNumber + 1);
          assert.notEqual(second.scenarioFormId, first.scenarioFormId);
          assert.notEqual(second.scenario.key, first.scenario.key);

          const share = new URL(shareUrl);
          const uiUrl = new URL(baseUrl + "/operational/specialist/sandbox");
          const shareToken = share.searchParams.get("_vercel_share");
          if (shareToken) uiUrl.searchParams.set("_vercel_share", shareToken);
          await page.goto(uiUrl.toString(), {
            waitUntil: "domcontentloaded",
            timeout: 90000,
          });
          await page.waitForTimeout(5000);
          const bodyText = await page.locator("body").innerText();
          console.log("SANDBOX_V1R2_UI_BODY=" + bodyText.slice(0, 6000));
          console.log("SANDBOX_V1R2_PAGE_ERRORS=" + JSON.stringify(pageErrors));
          assert.match(bodyText, /Sandbox readiness/i, "Sandbox readiness UI did not render");

          console.log("SANDBOX_V1R2_CONTENT_GRADUATION_PASS=" + JSON.stringify({
            bankVersion: first.bankVersion,
            activePrivateScenarioCount: 8,
            phaseCoverageRequired: 4,
            requiredDistinctScenarios: after.requiredDistinctScenarios,
            policyStatus: after.policyStatus,
            evidenceReady: after.evidenceReady,
            practicalsReady: after.practicalsReady,
            automaticTransition: after.automaticTransition,
            firstScenario: first.scenario.key,
            firstPhase: first.scenario.phase,
            persistedAttemptId: result.attemptId,
            retryScenario: second.scenario.key,
            retryPhase: second.scenario.phase,
            retryRotated: second.scenario.key !== first.scenario.key,
            canonicalLeakage: false,
            uiProgressRendered: true,
          }));

          await browser.close();
          NODE
