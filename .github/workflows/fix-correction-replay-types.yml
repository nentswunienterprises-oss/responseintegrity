name: Fix Correction Report Typing
on:
  push:
    branches: [proof/capability-engine-shadow-validation]
    paths: [.github/workflows/fix-correction-replay-types.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/capability-engine-shadow-validation
          fetch-depth: 0
      - name: Fix generated report regeneration typing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/correction-runtime-closeout.py')
          s = p.read_text()
          if 'const replacementStructured: any =' not in s:
            if 'const replacementStructured =' not in s:
              raise SystemExit('replacementStructured target not found')
            s = s.replace('const replacementStructured =', 'const replacementStructured: any =', 1)
            p.write_text(s)
          PY
          git diff --check
          git diff -- .github/scripts/correction-runtime-closeout.py
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'nentswunienterprises-oss'
          git config user.email 'nentswunienterprises@gmail.com'
          git add .github/scripts/correction-runtime-closeout.py
          git commit -m 'Fix correction report regeneration typing'
          git push origin HEAD:proof/capability-engine-shadow-validation
