name: Fix Correction Report Typing
on:
  push:
    branches: [proof/capability-engine-shadow-validation]
    paths: [.github/workflows/fix-correction-replay-types.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/capability-engine-shadow-validation
          fetch-depth: 0
      - name: Fix generated report regeneration typing and retrigger closeout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/correction-runtime-closeout.py')
          s = p.read_text()
          old = '        const replacementStructured = report.report_type === "weekly"\n'
          new = '        const replacementStructured: any = report.report_type === "weekly"\n'
          if old not in s:
            raise SystemExit('replacementStructured target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          wf = Path('.github/workflows/correction-runtime-closeout.yml')
          wf.write_text(wf.read_text().rstrip() + '\n# rerun: correction report typing fixed\n')
          PY
          git diff --check
          git config user.name 'nentswunienterprises-oss'
          git config user.email 'nentswunienterprises@gmail.com'
          git add .github/scripts/correction-runtime-closeout.py .github/workflows/correction-runtime-closeout.yml
          git commit -m 'Fix correction report regeneration typing'
          git push origin HEAD:proof/capability-engine-shadow-validation
