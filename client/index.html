    <script>
      // Apply the saved RI appearance before first paint so the startup loader
      // does not flash the wrong surface while React is booting.
      (function () {
        var theme = "dark";
        try {
          var storedTheme = localStorage.getItem("ri-ui-theme");
          if (storedTheme === "light" || storedTheme === "warm-dark" || storedTheme === "dark") {
            theme = storedTheme;
          }
        } catch (_) {
          // Storage can be unavailable in hardened/private contexts.
        }
        document.documentElement.dataset.riTheme = theme;
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html {
        --loader-bg: #0E0E0E;
        --loader-ink: #FFF5ED;
        --loader-muted: #B9ABAD;
        --loader-spinner-track: rgba(255, 245, 237, 0.14);
        --loader-spinner-active: #E63946;
        color-scheme: dark;
      }

      html[data-ri-theme="light"] {
        --loader-bg: #FFF5ED;
        --loader-ink: #1A1A1A;
        --loader-muted: #6B5A5D;
        --loader-spinner-track: #E9DDD8;
        --loader-spinner-active: #E63946;
        color-scheme: light;
      }

      html[data-ri-theme="warm-dark"] {
        --loader-bg: #111111;
        --loader-ink: #FFF5ED;
        --loader-muted: #C8B5B8;
        --loader-spinner-track: rgba(255, 240, 240, 0.16);
        --loader-spinner-active: #E63946;
        color-scheme: dark;
      }

      html[data-ri-theme="dark"] {
        --loader-bg: #0E0E0E;
        --loader-ink: #FFF5ED;
        --loader-muted: #B9ABAD;
        --loader-spinner-track: rgba(255, 245, 237, 0.14);
        --loader-spinner-active: #E63946;
        color-scheme: dark;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: var(--loader-bg);
        overflow-x: hidden !important;
      }

      #root { min-height: 100vh; }

      #root-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--loader-bg);
        color: var(--loader-ink);
        z-index: 9999;
      }

      .loader-content { text-align: center; }
      .loader-symbol { display: block; width: auto; height: 80px; margin: 0 auto 12px; }
      .logo { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 16px; line-height: 0.95; text-transform: uppercase; }
      .logo-response { font-size: 18px; font-weight: 700; letter-spacing: 0.14em; color: #E63946; }
      .logo-integrity { font-size: 15px; font-weight: 700; letter-spacing: 0.18em; color: var(--loader-ink); }
      .spinner { width: 40px; height: 40px; border: 3px solid var(--loader-spinner-track); border-top-color: var(--loader-spinner-active); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .text { margin-top: 16px; font-size: 14px; color: var(--loader-muted); }
    </style>
  </head>
  <body>
    <div id="root-loader">
      <div class="loader-content">
        <img class="loader-symbol" src="/ri-symbol-logo.svg?v=20260926-2" alt="Response Integrity logo" />
        <h1 class="logo"><span class="logo-response">Response</span><span class="logo-integrity">Integrity</span></h1>

    <script>
      // Debug helper: run only when ?debug_overflow=1 is present in the URL.
      (function() {
        if (!location.search.includes('debug_overflow=1')) return;
        function outlineOverflowing() {
          const w = window.innerWidth || document.documentElement.clientWidth;
          const els = Array.from(document.querySelectorAll('body *'));
          let found = 0;
          els.forEach((el) => {
            try {
              const r = el.getBoundingClientRect();
              if (r.right > w + 1 || r.left < -1) {
                found++;
                el.classList.add('overflow-debug-outline');
                console.warn('Overflowing element', el, {left: r.left, right: r.right, width: r.width});
              }
            } catch (e) {
              // ignore
            }
          });
          if (!found) console.info('No overflowing elements detected');
        }

        // add debug style
        const s = document.createElement('style');
        s.textContent = `
          .overflow-debug-outline{outline:3px solid rgba(255,0,0,0.9)!important;}
        `;
        document.head.appendChild(s);

        window.addEventListener('load', () => setTimeout(outlineOverflowing, 300));
        window.addEventListener('resize', () => setTimeout(outlineOverflowing, 200));
      })();
    </script>
  </body>
